"use strict";

const Quran = (() => {
  const BASE = "https://api.equran.id/v2";
  const TTL_LIST = 30 * 86400000;
  const TTL_SURAH = 30 * 86400000;
  const TTL_TAFSIR = 60 * 86400000;

  /* Batas awal juz (surah:ayah) untuk menghitung juz suatu ayat */
  const JUZ_STARTS = [
    [1, 1], [2, 142], [2, 253], [3, 93], [4, 24], [4, 148], [5, 82],
    [6, 111], [7, 88], [8, 41], [9, 93], [11, 6], [12, 53], [15, 1],
    [17, 1], [18, 75], [21, 1], [23, 1], [25, 21], [27, 56], [29, 46],
    [33, 31], [36, 28], [39, 32], [41, 47], [46, 1], [51, 31], [58, 1],
    [67, 1], [78, 1],
  ];
  const SUMS = (() => {
    const out = [0];
    let acc = 0;
    for (const s of window.SURAH_META || []) { acc += s[4]; out.push(acc); }
    return out;
  })();

  function getJuz(surah, ayah) {
    const idx = (SUMS[surah - 1] || 0) + ayah;
    let juz = 1;
    for (let i = 0; i < JUZ_STARTS.length; i++) {
      const [s, a] = JUZ_STARTS[i];
      const start = SUMS[s - 1] + a;
      if (idx >= start) juz = i + 1;
    }
    return juz;
  }

  function fresh(rec, ttl) {
    return rec && rec.fetchedAt && (Date.now() - rec.fetchedAt) < ttl;
  }

  async function listSurahs(force) {
    // 1) cache IDB
    if (!force) {
      try {
        const cached = await DB.get("quran_surahs", "list:v2");
        if (fresh(cached, TTL_LIST)) return cached.data;
      } catch (e) { /* noop */ }
    }
    try {
      const raw = await Api.fetchJson(BASE + "/surat", { timeout: 15000 });
      if (!raw || !raw.data || !raw.data.length) throw new Error("Data surah kosong");
      const data = raw.data.map((s) => ({
        number: s.nomor, name: s.namaLatin, arabic: s.nama, meaning: s.arti,
        ayahs: s.jumlahAyat, place: s.tempatTurun === "Madinah" ? "s" : "m", desc: s.deskripsi || "",
      }));
      try { await DB.put("quran_surahs", { id: "list:v2", data, fetchedAt: Date.now() }); } catch (e) { /* noop */ }
      return data;
    } catch (e) {
      // fallback offline
      const cached = await DB.get("quran_surahs", "list:v2").catch(() => null);
      if (cached && cached.data) return cached.data;
      return (window.SURAH_META || []).map((s) => ({
        number: s[0], name: s[2], arabic: s[1], meaning: s[3], ayahs: s[4], place: s[5],
      }));
    }
  }

  async function getSurah(number, force) {
    const n = parseInt(number, 10);
    if (!force) {
      try {
        const cached = await DB.get("quran_ayahs", "surah:" + n);
        if (fresh(cached, TTL_SURAH)) return cached.data;
      } catch (e) { /* noop */ }
    }
    try {
      const raw = await Api.fetchJson(BASE + "/surat/" + n, { timeout: 20000 });
      if (!raw || !raw.data || !raw.data.ayat || !raw.data.ayat.length) throw new Error("Data surah kosong");
      const d = raw.data;
      const data = {
        number: d.nomor, name: d.namaLatin, arabic: d.nama, meaning: d.arti,
        ayahs: d.ayat.map((a) => ({
          number: a.nomorAyat, arab: a.teksArab, latin: a.teksLatin, ind: a.teksIndonesia,
          audio: (a.audio && a.audio["01"]) || "",
        })),
      };
      try { await DB.put("quran_ayahs", { id: "surah:" + n, data, fetchedAt: Date.now() }); } catch (e) { /* noop */ }
      return data;
    } catch (e) {
      const cached = await DB.get("quran_ayahs", "surah:" + n).catch(() => null);
      if (cached && cached.data) return cached.data;
      throw e;
    }
  }

  async function getTafsir(surah, ayah, force) {
    const key = "tafsir:" + surah + ":" + ayah;
    if (!force) {
      try {
        const cached = await DB.get("quran_tafsir", key);
        if (fresh(cached, TTL_TAFSIR)) return cached.data;
      } catch (e) { /* noop */ }
    }
    try {
      const raw = await Api.fetchJson(BASE + "/tafsir/" + surah + "/" + ayah, { timeout: 12000 });
      const t = raw && raw.data && raw.data.tafsir && raw.data.tafsir[0];
      const data = { surah, ayah, text: (t && t.tafsir) || "", source: "Kemenag RI (equran.id)" };
      try { await DB.put("quran_tafsir", { id: key, data, fetchedAt: Date.now() }); } catch (e) { /* noop */ }
      return data;
    } catch (e) {
      const cached = await DB.get("quran_tafsir", key).catch(() => null);
      if (cached && cached.data) return cached.data;
      throw e;
    }
  }

  return { listSurahs, getSurah, getTafsir, getJuz };
})();

window.Quran = Quran;

/* ============================================================
   SILMIKAFFAH — SERVICE: HADIS
   Sumber: fawazahmed0/hadith-api (CDN jsdelivr), edisi Indonesia.
   Struktur: Koleksi → Kitab (reference.book) → Hadis.
   Cache IndexedDB 7 hari; fallback cache saat offline.
   ============================================================ */
"use strict";

const Hadith = (() => {
  const CDN = "https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions";
  const TTL = 7 * 86400000;

  const COLLECTIONS = [
    { code: "ind-bukhari", title: "Shahih Bukhari", desc: "± 7.275 hadis · Imam al-Bukhari (w. 256 H)", arabic: "صحيح البخاري" },
    { code: "ind-muslim", title: "Shahih Muslim", desc: "± 7.275 hadis · Imam Muslim (w. 261 H)", arabic: "صحيح مسلم" },
    { code: "ind-abudawud", title: "Sunan Abu Dawud", desc: "± 5.274 hadis hukum · Imam Abu Dawud (w. 275 H)", arabic: "سنن أبي داود" },
    { code: "ind-tirmidhi", title: "Jami' At-Tirmidzi", desc: "± 3.956 hadis · Imam at-Tirmidzi (w. 279 H)", arabic: "جامع الترمذي" },
    { code: "ind-nasai", title: "Sunan An-Nasa'i", desc: "± 5.761 hadis · Imam an-Nasa'i (w. 303 H)", arabic: "سنن النسائي" },
    { code: "ind-ibnmajah", title: "Sunan Ibnu Majah", desc: "± 4.341 hadis · Imam Ibnu Majah (w. 273 H)", arabic: "سنن ابن ماجه" },
  ];

  function fresh(rec) {
    return rec && rec.fetchedAt && (Date.now() - rec.fetchedAt) < TTL;
  }

  async function getCollection(code, force) {
    const col = COLLECTIONS.find((c) => c.code === code) || { code, title: code };
    if (!force) {
      try {
        const cached = await DB.get("hadith_collections", "col:" + code);
        if (fresh(cached)) return cached.data;
      } catch (e) { /* noop */ }
    }
    try {
      const raw = await Api.fetchJson(CDN + "/" + code + ".json", { timeout: 30000 });
      const hadiths = Array.isArray(raw.hadiths) ? raw.hadiths : [];
      if (!hadiths.length) throw new Error("Data hadis kosong");
      const data = { code, title: col.title, arabic: col.arabic || "", desc: col.desc || "", metadata: raw.metadata || {}, hadiths, count: hadiths.length };
      try { await DB.put("hadith_collections", { id: "col:" + code, data, fetchedAt: Date.now() }); } catch (e) { /* noop */ }
      return data;
    } catch (e) {
      const cached = await DB.get("hadith_collections", "col:" + code).catch(() => null);
      if (cached && cached.data) return cached.data;
      throw e;
    }
  }

  function getBooks(col) {
    const map = new Map();
    for (const h of col.hadiths) {
      const book = (h.reference && h.reference.book) || 0;
      if (!map.has(book)) map.set(book, { book, count: 0, first: h });
      map.get(book).count++;
    }
    return Array.from(map.values()).sort((a, b) => a.book - b.book);
  }

  function getBookHadiths(col, book) {
    return col.hadiths.filter((h) => ((h.reference && h.reference.book) || 0) === book);
  }

  function searchInCollection(col, query) {
    const q = Utils.normalize(query);
    if (!q) return [];
    return col.hadiths.filter((h) => {
      const t = Utils.normalize(h.text);
      return t.includes(q) || (h.grades && h.grades.some((g) => Utils.normalize(g.name).includes(q)));
    }).slice(0, 50);
  }

  return { COLLECTIONS, getCollection, getBooks, getBookHadiths, searchInCollection };
})();

window.Hadith = Hadith;

      nextBlock.appendChild(h("span.prayer-item__time", { style: { color: "var(--on-primary-soft)", fontSize: "var(--fs-title)" } }, esc(next.next.time)));
      card.appendChild(nextBlock);

      const grid = h("div.prayer-grid");
      next.items.forEach((it, i) => {
        const item = h("div.prayer-item" + (i === next.nextIndex ? ".is-next" : "") + (i < next.nextIndex ? ".is-past" : ""));
        item.appendChild(h("div.prayer-item__name", null, it.label));
        item.appendChild(h("div.prayer-item__time", null, esc(it.time)));
        grid.appendChild(item);
      });
      card.appendChild(grid);
      if (res.source === "cache" && res.stale) {
        card.appendChild(h("p.typo-caption.mt-2", { style: { color: "var(--on-surface-variant)" } }, I18n.t("state.offline")));
      }
      box.appendChild(card);

      if (onNavigate) onNavigate();
      // update countdown tiap menit
      clearInterval(prayerSection._timer);
      prayerSection._timer = setInterval(() => {
        if (document.body.contains(box)) {
          const n2 = Prayer.computeNext(res.times);
          const nm = box.querySelector(".prayer-next__name");
          const cd = box.querySelector(".prayer-next__countdown");
          if (nm) nm.textContent = (n2.isTomorrow ? "→ " : "") + n2.next.label;
          if (cd) cd.textContent = n2.isTomorrow ? I18n.t("prayer.next") + ": " + n2.next.label + " · " + Prayer.countdownString(n2.next.minutes) : Prayer.countdownString(n2.next.minutes) + " lagi";
          box.querySelectorAll(".prayer-item").forEach((el2, i) => {
            el2.classList.toggle("is-next", i === n2.nextIndex);
            el2.classList.toggle("is-past", i < n2.nextIndex);
          });
        } else {
          clearInterval(prayerSection._timer);
        }
      }, 30000);
    }

    load();
    return wrap;
  }

  function featured() {
    const items = [
      { tag: "Al-Qur'an", title: "Baca Al-Qur'an", desc: "114 surah · terjemah · tafsir · audio", path: "/quran" },
      { tag: "Kamus", title: "Kamus Bahasa Arab", desc: "Arab ↔ Indonesia, lengkap dengan akar kata", path: "/dictionary" },
      { tag: "Zakat", title: "Kalkulator Zakat", desc: "Hitung zakat maal & fitrah", path: "/tools/zakat" },
    ];
    const wrap = h("div.carousel-wrap");
    const carousel = h("div.carousel");
    const dotEls = [];
    items.forEach((it, i) => {
      const cell = h("div.carousel__item");
      const card = h("div.featured-card", {
        onclick: () => Router.navigate(it.path), role: "button", tabindex: "0",
        onkeydown: (e) => { if (e.key === "Enter") Router.navigate(it.path); },
      });
      card.appendChild(h("div.featured-card__tag", null, it.tag));
      card.appendChild(h("div.featured-card__title", null, it.title));
      card.appendChild(h("div.featured-card__desc", null, it.desc));
      card.appendChild(h("span.featured-card__arrow", null, Components.icon("arrow-right", 18)));
      cell.appendChild(card);
      carousel.appendChild(cell);
      const dot = h("button.carousel-dot" + (i === 0 ? ".is-active" : ""), {
        "aria-label": "Slide " + (i + 1), onclick: () => go(i),
      });
      dotEls.push(dot);
    });
    const dots = h("div.carousel-dots", { role: "tablist", "aria-label": "Unggulan" });
    dotEls.forEach((d) => dots.appendChild(d));
    wrap.appendChild(carousel);
    wrap.appendChild(dots);

    let idx = 0, timer = null, restartTimer = null;

    function step() { return carousel.clientWidth * 0.78 + 12; }
    function go(i) {
      idx = (i + items.length) % items.length;
      carousel.scrollTo({ left: idx * step(), behavior: "smooth" });
      dotEls.forEach((d, j) => d.classList.toggle("is-active", j === idx));
    }
    function start() {
      stop();
      timer = setInterval(() => {
        if (!document.body.contains(wrap)) { stop(); return; }
        go(idx + 1);
      }, 6000);
    }
    function stop() { if (timer) { clearInterval(timer); timer = null; } }
    function pauseAndRestart() {
      stop();
      clearTimeout(restartTimer);
      restartTimer = setTimeout(start, 12000);
    }
    carousel.addEventListener("pointerdown", pauseAndRestart);
    carousel.addEventListener("touchstart", pauseAndRestart, { passive: true });
    carousel.addEventListener("scroll", Utils.debounce(() => {
      const cur = Math.round(carousel.scrollLeft / step());
      if (cur >= 0 && cur < dotEls.length) { idx = cur; dotEls.forEach((d, j) => d.classList.toggle("is-active", j === cur)); }
    }, 120), { passive: true });
    start();
    return wrap;
  }

  function quickAccess() {
    const items = [
      { label: "Al-Qur'an", icon: "book-open", path: "/quran" },
      { label: "Hadis", icon: "scroll", path: "/hadith" },
      { label: "Jadwal Sholat", icon: "clock", path: "/prayer" },

        onkeydown: (e) => { if (e.key === "Enter") Router.navigate(it.path); },
      }, [
        Components.icon(it.icon, 24),
        h("span.qa-chip__label", null, it.label),
      ]));
    });

  function mainMenu() {

    const grid = h("div.grid-3");
    cats.forEach((c) => {
      grid.appendChild(h("div.menu-tile", {

      }, [
        h("div.menu-tile__icon", null, Components.icon(c.icon, 26)),
        h("span.menu-tile__label", null, c.title),
      ]));
    });
    return grid;
  }

  function recommendations() {
    const items = [
      { title: "Zakat Maal", desc: "Nisab, haul, dan perhitungan 2,5%", path: "/k/rukun-islam/zakat/zakat-maal", icon: "coins" },
      { title: "Waris & Faraid", desc: "Bagian ahli waris menurut Al-Qur'an", path: "/k/keluarga-muamalah/waris-faraid/bagian-ahli-waris", icon: "scale" },
      { title: "Adab Kematian & Takziah", desc: "Ucapan, doa, dan adab pemakaman", path: "/k/akhlak-adab/adab-kematian-takziah", icon: "hand" },
      { title: "Doa Harian", desc: "Doa sehari-hari yang diajarkan Nabi ﷺ", path: "/k/doa-dzikir/doa-harian", icon: "heart" },
    ];
    const list = h("div.list");
    items.forEach((it) => {
      list.appendChild(Components.listRow({ icon: it.icon, title: it.title, desc: it.desc, onClick: () => Router.navigate(it.path) }));
    });
    return list;
  }

  async function recentSection() {
    try {
      const recs = await DB.getHistory(5);
      if (!recs.length) return null;
      const sec = Components.section({ title: I18n.t("home.recent"), link: I18n.t("list.seeAll"), linkPath: "/collection" });
      const list = h("div.list");
      recs.forEach((r) => {
        list.appendChild(Components.listRow({ icon: r.icon || "book", title: r.title, desc: r.target, onClick: () => Router.navigate(r.target) }));
      });
      sec.appendChild(list);
      return sec;
    } catch (e) {
      return null;
    }
  }

  async function render(app) {
    app.appendChild(Components.brandBar([
      Components.iconBtn("search", { onClick: () => Router.navigate("/search"), label: I18n.t("action.search") }),
    ]));

    const page = h("div.page");
    app.appendChild(page);

    page.appendChild(hijriCard());
    page.appendChild(quoteCard());

    // Jadwal sholat
    page.appendChild(prayerSection(() => {}));

    // Smart search
    const searchWrap = Components.section({ title: I18n.t("home.search") });
    const sb = h("div.search-box");
    const input = h("input.input", {
      type: "text", placeholder: I18n.t("search.hint"), "aria-label": I18n.t("home.search"),
      onkeydown: (e) => { if (e.key === "Enter") { const q = input.value.trim(); Router.navigate("/search" + (q ? "?q=" + encodeURIComponent(q) : "")); } },
      onclick: () => Router.navigate("/search"),

    sb.appendChild(Components.icon("search", 22));

    searchWrap.appendChild(sb);

    // Featured

  return { render };
})();

/* ===== INLINE: js/pages/category.js ===== */
/* ============================================================
   SILMIKAFFAH — PAGE: KATEGORI / SUBMENU (LIST)
   Halaman kategori memakai LIST ringkas untuk submenu,
   bukan card besar. Entri leaf dialihkan ke Pages.detail.
   ============================================================ */
"use strict";

const PagesCategory = (() => {
  const { h, esc } = Utils;

  async function render(app, ctx) {
    const segments = [];
    for (let i = 1; i <= 4; i++) {
      if (ctx.params["p" + i]) segments.push(ctx.params["p" + i]);
    }
    const found = Content.getNode(segments);
    if (!found) {
      app.appendChild(Components.appBar({ title: I18n.t("state.empty"), back: true }));
      const page = h("div.page");
      page.appendChild(Components.state({ icon: "inbox", title: I18n.t("state.empty"), desc: I18n.t("state.empty.desc") }));
      app.appendChild(page);
      Components.bottomNav("/home");
      return;
    }

    const { node, trail } = found;

    // Leaf dengan entry → tampilkan halaman detail
    if (node.entry) {
      window.Pages.detail.renderEntry(app, { node, trail, params: ctx.params });
      return;
    }

    const kids = node.children || [];
    app.appendChild(Components.appBar({ title: node.title, sub: trail.length > 1 ? trail[trail.length - 2].title : null, back: true }));
    const page = h("div.page");
    app.appendChild(page);

    // Hero kategori
    const hero = h("div.cat-hero.fade-up");
    hero.appendChild(h("div.cat-hero__icon", null, Components.icon(node.icon || "folder", 30)));
    const heroText = h("div.grow");
    heroText.appendChild(h("div.cat-hero__title", null, node.title));
    if (node.desc) heroText.appendChild(h("div.cat-hero__desc", null, node.desc));
    hero.appendChild(heroText);
    page.appendChild(hero);

    if (!kids.length) {
      page.appendChild(Components.state({ icon: "inbox", title: I18n.t("state.empty"), desc: I18n.t("state.empty.desc") }));
    } else {
      page.appendChild(h("div.section"));
      const list = h("div.list");
      kids.forEach((kid) => {
        const route = "/k/" + segments.concat(kid.slug).join("/");
        list.appendChild(Components.listRow({
          icon: kid.icon || "folder",
          title: kid.title,
          desc: kid.desc || (kid.children && kid.children.length ? kid.children.length + " item" : ""),
          onClick: () => Router.navigate(route),
        }));
      });
      page.appendChild(list);
    }

    Router.setTitle(node.title);
    Components.bottomNav(segments[0] === "rukun-iman" ? "/k/rukun-iman" : segments[0] === "rukun-islam" ? "/k/rukun-islam" : "/home");
    page.classList.add("fade-in");
  }

  return { render };
})();

  <script>
/* ===== INLINE: js/pages/detail.js ===== */
/* ============================================================
   SILMIKAFFAH — PAGE: DETAIL
   Hierarchy: App Bar → Breadcrumb → Title → Summary →
   Info utama (grid) → Expandable sections → Dalil/Referensi →
   Konten terkait. Aksi: bookmark, favorit, catatan, salin.
   Riwayat baca direkam otomatis.
   ============================================================ */
"use strict";

const PagesDetail = (() => {
  const { h, esc } = Utils;

  function paragraphs(htmlText) {
    return String(htmlText || "")
      .split(/\n{2,}/)
      .map((p) => p.trim())
      .filter(Boolean)
      .map((p) => "<p>" + p.replace(/\n/g, "<br>") + "</p>")
      .join("");
  }

  function renderEntry(app, { node, trail, params }) {
    const entry = node.entry || {};
    const route = "/k/" + trail.map((t) => t.route.split("/").pop()).join("/");
    const title = node.title;
    const icon = node.icon || "book";

    // Rekam riwayat baca
    DB.addHistory(route, title, icon).catch(() => {});

    // App bar + aksi
    const bookmarkBtn = Components.iconBtn("bookmark", { label: I18n.t("action.bookmark"), onClick: toggleBookmark });
    const favBtn = Components.iconBtn("heart", { label: I18n.t("action.favorite"), onClick: toggleFav });
    const noteBtn = Components.iconBtn("note", { label: I18n.t("action.note"), onClick: openNote });

    app.appendChild(Components.appBar({ title: title, sub: trail.length > 1 ? trail[trail.length - 2].title : null, back: true, actions: [noteBtn, favBtn, bookmarkBtn] }));

    const page = h("div.page");
    app.appendChild(page);

    // Breadcrumb ringkas
    if (trail.length > 1) {
      const crumb = h("div.typo-caption.mb-3", { style: { color: "var(--on-surface-variant)" } });
      crumb.textContent = trail.slice(0, -1).map((t) => t.title).join(" · ");
      page.appendChild(crumb);
    }

    // Header
    const header = h("div.detail-header.fade-up");
    header.appendChild(h("h1.detail-title", null, title));
    if (entry.s) header.appendChild(h("p.detail-summary", null, entry.s));
    page.appendChild(header);

    // Info grid
    if (entry.i && entry.i.length) {
      const grid = h("div.info-grid.mt-4");
      entry.i.forEach((cell) => {
        const c = h("div.info-cell");
        c.appendChild(h("div.info-cell__label", null, cell.l || ""));
        c.appendChild(h("div.info-cell__value", null, cell.v || ""));
        grid.appendChild(c);
      });
      page.appendChild(grid);
    }

    // Expandable sections
    if (entry.sec && entry.sec.length) {
      const secWrap = h("div.section");
      entry.sec.forEach((s, idx) => {
        secWrap.appendChild(Components.expandable({
          icon: idx === 0 ? "info" : "chevron-right",
          title: s.t,
          bodyHtml: paragraphs(s.b),
          open: idx === 0 && entry.sec.length <= 3,
        }));
      });
      page.appendChild(secWrap);
    }

    // Dalil
    if (entry.d && entry.d.length) {
      page.appendChild(h("div.section"));
      entry.d.forEach((d) => {
        const block = h("div.dalil");
        block.appendChild(h("p.dalil__text", null, d.t));
        block.appendChild(h("div.dalil__ref", null, d.r));
        page.appendChild(block);
      });
    }

    // Referensi
    if (entry.ref && entry.ref.length) {
      const sec = Components.section({ title: I18n.t("settings.sources") });
      const list = h("div.list");
      entry.ref.forEach((r) => {
        list.appendChild(Components.listRow({
          icon: "link", title: r.l, desc: r.u || "Sumber rujukan",
          onClick: r.u ? () => window.open(r.u, "_blank", "noopener") : null,
        }));
      });
      sec.appendChild(list);
      page.appendChild(sec);
    }

    // Related
    if (entry.rel && entry.rel.length) {
      const sec = Components.section({ title: "Konten Terkait" });
      const list = h("div.list");
      entry.rel.forEach((r) => {
        list.appendChild(Components.listRow({ icon: "arrow-right", title: r.l, onClick: () => Router.navigate(r.p) }));
      });
      sec.appendChild(list);
      page.appendChild(sec);
    }

    // Status bookmark/favorit
    DB.isBookmarked(route).then((b) => { bookmarkBtn.classList.toggle("icon-btn--primary", b); bookmarkBtn.setAttribute("aria-pressed", String(b)); });
    DB.isFavorite(route).then((f) => { favBtn.classList.toggle("icon-btn--primary", f); favBtn.setAttribute("aria-pressed", String(f)); });

    function toggleBookmark() {
      DB.isBookmarked(route).then((b) => {
        if (b) { DB.removeBookmark(route); bookmarkBtn.classList.remove("icon-btn--primary"); Components.toast(I18n.t("collection.bookmarks") + " —"); }
        else { DB.addBookmark(route, title, icon); bookmarkBtn.classList.add("icon-btn--primary"); Components.toast(I18n.t("collection.bookmarks") + " ✓"); }
      });
    }
    function toggleFav() {
      DB.isFavorite(route).then((f) => {
        if (f) { DB.removeFavorite(route); favBtn.classList.remove("icon-btn--primary"); Components.toast(I18n.t("collection.favorites") + " —"); }
        else { DB.addFavorite(route, title, icon); favBtn.classList.add("icon-btn--primary"); Components.toast(I18n.t("collection.favorites") + " ✓"); }
      });
    }
    function openNote() {
      const ta = h("textarea.input", { placeholder: "Tulis catatan Anda…" });
      ta.style.minHeight = "120px";
      const btn = h("button.btn.btn--primary.btn--block", { onclick: async () => {
        const body = ta.value.trim();
        if (!body) { Components.toast(I18n.t("state.empty")); return; }
        await DB.addNote({ target: route, title: title, body: body });
        sheet.close();
        Components.toast(I18n.t("action.note") + " ✓");
      } }, I18n.t("action.save"));
      const sheet = Components.sheet({ title: "Catatan — " + title, children: [ta, h("div.mt-3"), btn] });
    }

    Router.setTitle(title);
    const activeNav = params && params.nav ? params.nav : "/home";
    Components.bottomNav(activeNav);
    page.classList.add("fade-in");
  }

  return { renderEntry };
})();

window.Pages = window.Pages || {};
window.Pages.detail = PagesDetail;

</script>
  <script>
/* ===== INLINE: js/pages/search.js ===== */
/* ============================================================
   SILMIKAFFAH — PAGE: SMART SEARCH (Global Search)
   Mencari materi, surah/ayat, hadis, doa, kamus, istilah.
   Hasil = LIST ringkas + badge jenis; recent search, saran,
   filter kategori, dan sortir.
   ============================================================ */
"use strict";

const PagesSearch = (() => {
  const { h, esc } = Utils;
  const RECENT_KEY = "recent.search";

  const FILTERS = [
    { key: "all", labelKey: "search.filter.all" },
    { key: "materi", labelKey: "search.filter.materi" },
    { key: "quran", labelKey: "search.filter.quran" },
    { key: "hadith", labelKey: "search.filter.hadith" },
    { key: "kamus", labelKey: "search.filter.kamus" },
    { key: "doa", labelKey: "search.filter.doa" },
  ];

  const SUGGESTIONS = ["Zakat", "Wudhu", "Sabar", "Doa", "Al-Fatihah", "Haji", "Niat", "Takziah"];

  function getRecent() { return Store.get(RECENT_KEY, []); }
  function addRecent(q) {
    const list = getRecent().filter((x) => x !== q);
    list.unshift(q);
    Store.set(RECENT_KEY, list.slice(0, 8));
  }
  function clearRecent() { Store.remove(RECENT_KEY); }

  function render(app, ctx) {
    const initialQ = (ctx.query && ctx.query.q) || "";
    let filter = "all";
    let sortAZ = false;

    app.appendChild(Components.appBar({ title: I18n.t("action.search"), back: true }));

    const page = h("div.page");
    app.appendChild(page);

    // Input pencarian
    const sb = h("div.search-box");
    const input = h("input.input", {
      type: "search", placeholder: I18n.t("search.hint"), value: initialQ,
      "aria-label": I18n.t("action.search"),
      oninput: Utils.debounce(() => run(), 220),
      onkeydown: (e) => { if (e.key === "Enter") { if (input.value.trim()) addRecent(input.value.trim()); run(); } },
    });
    const clearBtn = h("button.icon-btn.search-clear", {
      "aria-label": I18n.t("action.clear"),
      style: { display: initialQ ? "flex" : "none" },
      onclick: () => { input.value = ""; clearBtn.style.display = "none"; run(); input.focus(); },
    }, Components.icon("close", 20));
    sb.appendChild(Components.icon("search", 22));
    sb.appendChild(input);
    sb.appendChild(clearBtn);
    page.appendChild(sb);

    const resultsBox = h("div");
    page.appendChild(resultsBox);

    // Filter chips + sortir
    const filterRow = h("div");
    const sortBtn = h("button.chip", null, [Components.icon("sort", 16), esc(I18n.t("search.sort.relevance"))]);
    const chipWrap = h("div.chip-row.mt-3");
    FILTERS.forEach((f, i) => {
      const chip = h("button.chip" + (i === 0 ? ".is-active" : ""), {
        onclick: () => {
          chipWrap.querySelectorAll(".chip").forEach((c) => c.classList.remove("is-active"));
          chip.classList.add("is-active");
          filter = f.key;
          run();
        },
      }, I18n.t(f.labelKey));
      chipWrap.appendChild(chip);
    });
    chipWrap.appendChild(sortBtn);
    filterRow.appendChild(chipWrap);
    sortBtn.onclick = () => {
      sortAZ = !sortAZ;
      sortBtn.innerHTML = "";
      sortBtn.appendChild(Components.icon("sort", 16));
      sortBtn.appendChild(document.createTextNode(" " + (sortAZ ? I18n.t("search.sort.az") : I18n.t("search.sort.relevance"))));
      run();
    };
    resultsBox.appendChild(filterRow);

    const recentBox = h("div");
    const suggestionsBox = h("div");
    resultsBox.appendChild(recentBox);
    resultsBox.appendChild(suggestionsBox);

    function renderRecent() {
      recentBox.innerHTML = "";
      const recs = getRecent();
      if (!recs.length) return;
      const sec = Components.section({ title: I18n.t("search.recent") });
      const row = h("div.chip-row");
      recs.forEach((r) => {
        row.appendChild(h("button.chip", { onclick: () => { input.value = r; clearBtn.style.display = "flex"; run(); } }, [Components.icon("history", 16), esc(r)]));
      });
      row.appendChild(h("button.chip", { onclick: () => { clearRecent(); renderRecent(); } }, [Components.icon("trash", 16), esc(I18n.t("action.clear"))]));
      sec.appendChild(row);
      recentBox.appendChild(sec);
    }

    function renderSuggestions() {
      suggestionsBox.innerHTML = "";
      if (input.value.trim()) return;
      const sec = Components.section({ title: I18n.t("search.suggest") });
      const row = h("div.chip-row");
      SUGGESTIONS.forEach((s) => {
        row.appendChild(h("button.chip", { onclick: () => { input.value = s; clearBtn.style.display = "flex"; run(); } }, [Components.icon("sparkles", 16), esc(s)]));
      });
      sec.appendChild(row);
      suggestionsBox.appendChild(sec);
    }

    function run() {
      const q = input.value.trim();
      clearBtn.style.display = q ? "flex" : "none";
      renderRecent();
      renderSuggestions();
      if (!q) { resultsBox.querySelector(".result-list") && resultsBox.querySelector(".result-list").remove(); return; }

      let results = Content.search(q, filter === "all" ? null : filter);
      if (sortAZ) results = results.slice().sort((a, b) => a.title.localeCompare(b.title));

      let listEl = resultsBox.querySelector(".result-list");
      if (!listEl) { listEl = h("div.list.result-list"); resultsBox.appendChild(listEl); }
      listEl.innerHTML = "";

      if (!results.length) {
        listEl.appendChild(Components.state({ icon: "search", title: I18n.t("search.noresult"), desc: I18n.t("search.noresult.desc") }));
        return;
      }
      results.forEach((r) => {
        listEl.appendChild(Components.listRow({
          icon: r.icon,
          titleHtml: Utils.highlight(r.title, q),
          desc: r.subtitle ? Utils.highlight(r.subtitle, q) : "",
          badge: r.badge,
          onClick: () => { addRecent(q); Router.navigate(r.route); },
        }));
      });
    }

    renderRecent();
    renderSuggestions();
    if (initialQ) { input.value = initialQ; run(); }
    setTimeout(() => { try { input.focus(); } catch (e) { /* noop */ } }, 300);

    Router.setTitle(I18n.t("action.search"));
    Components.bottomNav("/home");
    page.classList.add("fade-in");
  }

  return { render };
})();

window.Pages.search = PagesSearch;

  <script>
/* ===== INLINE: js/pages/quran.js ===== */
/* ============================================================
   SILMIKAFFAH — PAGE: AL-QUR'AN
   Daftar 114 surah → surah + daftar ayat → detail ayat
   (Arab, latin, terjemahan, juz, tafsir, audio).
   Sumber: equran.id (Kemenag RI) + cache + fallback offline.
   ============================================================ */
"use strict";

const PagesQuran = (() => {
  const { h, esc } = Utils;
  let currentAudio = null;

  function stopAudio() {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  }

  /* ---------- Daftar surah ---------- */
  async function list(app, ctx) {
    app.appendChild(Components.appBar({ title: "Al-Qur'an", sub: "114 surah · 6.236 ayat", back: true }));
    const page = h("div.page");
    app.appendChild(page);

    const sb = h("div.search-box");
    const input = h("input.input", { type: "search", placeholder: "Cari surah… (mis. Al-Baqarah)", "aria-label": "Cari surah" });
    sb.appendChild(Components.icon("search", 22));
    sb.appendChild(input);
    page.appendChild(sb);

    const box = h("div.mt-4");
    page.appendChild(box);

    function renderList(data, q) {
      box.innerHTML = "";
      const query = Utils.normalize(q);
      const filtered = query
        ? data.filter((s) => Utils.normalize(s.name).includes(query) || Utils.normalize(s.meaning).includes(query) || Utils.normalize(s.arabic).includes(query))
        : data;
      if (!filtered.length) {
        box.appendChild(Components.state({ icon: "search", title: I18n.t("search.noresult"), desc: I18n.t("search.noresult.desc") }));
        return;
      }
      const listEl = h("div.list");
      filtered.forEach((s) => {
        const row = h("div.list-item", { onclick: () => Router.navigate("/quran/surah/" + s.number), role: "button", tabindex: "0", onkeydown: (e) => { if (e.key === "Enter") Router.navigate("/quran/surah/" + s.number); } });
        row.appendChild(h("div.list-item__icon", null, h("span.typo-title", null, s.number)));
        const main = h("div.list-item__main");
        main.appendChild(h("div.list-item__title", null, s.name));
        main.appendChild(h("div.list-item__desc", null, s.meaning + " · " + s.ayahs + " ayat · " + (s.place === "m" ? "Makkiyah" : "Madaniyah")));
        row.appendChild(main);
        row.appendChild(h("div.surah-row__arab", null, s.arabic));
        listEl.appendChild(row);
      });
      box.appendChild(listEl);
    }

    box.appendChild(Components.skeletonList(6));
    input.oninput = Utils.debounce(() => { if (cachedData) renderList(cachedData, input.value); }, 200);

    let cachedData = null;
    try {
      cachedData = await Quran.listSurahs();
      renderList(cachedData, input.value);
    } catch (e) {
      box.innerHTML = "";
      box.appendChild(Components.state({
        icon: "wifi-off", title: I18n.t("state.error"), desc: I18n.t("state.error.desc"),
        actionLabel: I18n.t("action.retry"), action: async () => { box.innerHTML = ""; box.appendChild(Components.skeletonList(4)); try { cachedData = await Quran.listSurahs(true); renderList(cachedData, input.value); } catch (e2) { box.innerHTML = ""; box.appendChild(Components.state({ icon: "alert", title: I18n.t("state.error"), desc: I18n.t("state.error.desc"), actionLabel: I18n.t("action.retry") })); } },
      }));
    }

    Router.setTitle("Al-Qur'an");
    Components.bottomNav("/home");
    page.classList.add("fade-in");
  }

  /* ---------- Detail surah ---------- */
  async function surah(app, ctx) {
    const n = parseInt(ctx.params.n, 10);
    stopAudio();
    app.appendChild(Components.appBar({ title: "Surah " + n, back: true }));
    const page = h("div.page");
    app.appendChild(page);
    const box = h("div");
    page.appendChild(box);

    box.appendChild(Components.skeletonList(4));
    try {
      const data = await Quran.getSurah(n);
      renderSurah(box, data);
    } catch (e) {
      box.innerHTML = "";
      box.appendChild(Components.state({
        icon: "wifi-off", title: I18n.t("state.error"), desc: I18n.t("state.error.desc"),
        actionLabel: I18n.t("action.retry"),
        action: async () => { box.innerHTML = ""; box.appendChild(Components.skeletonList(4)); try { renderSurah(box, await Quran.getSurah(n, true)); } catch (e2) { box.innerHTML = ""; box.appendChild(Components.state({ icon: "alert", title: I18n.t("state.error"), desc: I18n.t("state.error.desc") })); } },
      }));
    }

    function renderSurah(boxEl, data) {
      boxEl.innerHTML = "";
      const banner = h("div.surah-banner");
      banner.appendChild(h("div.surah-banner__arab", null, data.arabic));
      banner.appendChild(h("div.surah-banner__name", null, data.name));
      banner.appendChild(h("div.surah-banner__meta", null, data.meaning + " · " + data.ayahs.length + " ayat · " + (data.place === "s" ? "Madaniyah" : "Makkiyah")));
      boxEl.appendChild(banner);

      const listEl = h("div.list.mt-4");
      data.ayahs.forEach((a) => {
        const ayah = h("div.ayah", {
          onclick: () => Router.navigate("/quran/ayah/" + n + "/" + a.number),
          role: "button", tabindex: "0",
          onkeydown: (e) => { if (e.key === "Enter") Router.navigate("/quran/ayah/" + n + "/" + a.number); },
        });
        ayah.appendChild(h("div.ayah__arab", null, a.arab + " ﴿" + a.number + "﴾"));
        ayah.appendChild(h("div.ayah__trans", null, a.ind));
        listEl.appendChild(ayah);
      });
      boxEl.appendChild(listEl);
      Router.setTitle(data.name);
    }
    Components.bottomNav("/home");
    page.classList.add("fade-in");
  }

  /* ---------- Detail ayat ---------- */
  async function ayah(app, ctx) {
    const n = parseInt(ctx.params.n, 10);
    const a = parseInt(ctx.params.a, 10);
    stopAudio();
    app.appendChild(Components.appBar({ title: "Ayat " + a, sub: "Surah " + n, back: true }));
    const page = h("div.page");
    app.appendChild(page);
    const box = h("div");
    page.appendChild(box);

    box.appendChild(Components.skeletonList(3));
    let data = null, tafsir = null, tafsirErr = false;
    try {
      data = await Quran.getSurah(n);
      renderAyah();
      loadTafsir();
    } catch (e) {
      box.innerHTML = "";
      box.appendChild(Components.state({
        icon: "wifi-off", title: I18n.t("state.error"), desc: I18n.t("state.error.desc"),
        actionLabel: I18n.t("action.retry"),
        action: async () => { box.innerHTML = ""; box.appendChild(Components.skeletonList(3)); try { data = await Quran.getSurah(n, true); renderAyah(); loadTafsir(); } catch (e2) { box.innerHTML = ""; box.appendChild(Components.state({ icon: "alert", title: I18n.t("state.error"), desc: I18n.t("state.error.desc") })); } },
      }));
    }

    function renderAyah() {
      const ay = data.ayahs.find((x) => x.number === a);
      if (!ay) {
        box.innerHTML = "";
        box.appendChild(Components.state({ icon: "inbox", title: I18n.t("state.empty"), desc: I18n.t("state.empty.desc") }));
        return;
      }
      box.innerHTML = "";

      const juz = Quran.getJuz(n, a);
      const arabEl = h("div.ayah-detail-arab", null, ay.arab + " ﴿" + a + "﴾");

      if (ay.audio) {
        const playBtn = h("button.audio-btn", {

          onclick: () => {
            if (currentAudio && !currentAudio.paused) { currentAudio.pause(); playBtn.classList.remove("is-playing"); return; }
            stopAudio();
            const audio = new Audio(ay.audio);
            currentAudio = audio;
            playBtn.classList.add("is-playing");
            audio.play().catch(() => { playBtn.classList.remove("is-playing"); Components.toast(I18n.t("state.error.desc")); });
            audio.onended = () => { playBtn.classList.remove("is-playing"); currentAudio = null; };
          },
        }, Components.icon("play", 22));
        actions.appendChild(playBtn);

      const copyBtn = h("button.audio-btn", { "aria-label": I18n.t("action.copy"), onclick: () => Components.copyText(ay.arab + "\n" + ay.ind) }, Components.icon("copy", 22));

      box.appendChild(h("div.ayah-detail-trans.mt-2", null, ay.ind));

      const grid = h("div.info-grid.mt-4");
      [
        ["Surah", data.name + " (" + n + ")"],
        ["Ayat", String(a) + " dari " + data.ayahs.length],
        ["Juz", String(juz)],
        ["Bagian", data.place === "s" ? "Madaniyah" : "Makkiyah"],
      ].forEach((c) => {
        const cell = h("div.info-cell");

      box.appendChild(grid);

      const tafsirWrap = h("div.section");
      tafsirWrap.appendChild(Components.expandable({
        icon: "info", title: I18n.t("quran.tafsir"), bodyHtml: tafsirErr
          ? "<p>" + esc(I18n.t("state.error.desc")) + "</p>"
          : tafsir ? paragraphs(tafsir.text) : "<p>" + esc(I18n.t("state.loading")) + "</p>",
      }));
      box.appendChild(tafsirWrap);

      // Navigasi ayat sebelumnya/berikutnya
      const navRow = h("div.row.gap-2.mt-4");
      if (a > 1) {
        navRow.appendChild(h("button.btn.btn--outline.grow", { onclick: () => Router.navigate("/quran/ayah/" + n + "/" + (a - 1)) }, [Components.icon("chevron-left", 20), esc("Sebelumnya")]));
      }
      if (a < data.ayahs.length) {
        navRow.appendChild(h("button.btn.btn--outline.grow", { onclick: () => Router.navigate("/quran/ayah/" + n + "/" + (a + 1)) }, [esc("Berikutnya"), Components.icon("chevron-right", 20)]));
      }
      box.appendChild(navRow);

      Router.setTitle(data.name + " : " + a);
      DB.addHistory("/quran/ayah/" + n + "/" + a, "QS. " + data.name + " : " + a, "book-open").catch(() => {});
    }

    function paragraphs(text) {
      return String(text || "").split(/\n{2,}/).map((p) => p.trim()).filter(Boolean).map((p) => "<p>" + esc(p) + "</p>").join("");
    }

    async function loadTafsir() {
      try {
        tafsir = await Quran.getTafsir(n, a);
      } catch (e) {
        tafsirErr = true;
      }
      const body = box.querySelector(".expandable__content");
      if (body) {
        body.innerHTML = tafsirErr ? "<p>" + esc(I18n.t("state.error.desc")) + "</p>" : paragraphs(tafsir ? tafsir.text : "");
        if (tafsir && tafsir.source) {
          body.appendChild(document.createTextNode(""));
          const src = h("p.typo-caption", { style: { color: "var(--on-surface-variant)", marginTop: "8px" } }, "Sumber: " + tafsir.source);
          body.appendChild(src);
        }
      }
    }

    Components.bottomNav("/home");
    page.classList.add("fade-in");
  }

  return { list, surah, ayah };
})();

window.Pages = window.Pages || {};
window.Pages.quran = PagesQuran;

    app.appendChild(Components.appBar({ title: colMeta.title, sub: I18n.t("hadith.books"), back: true }));

        actionLabel: I18n.t("action.retry"),

    const book = parseInt(ctx.params.book, 10) || 0;

    app.appendChild(page);
    const box = h("div");
    page.appendChild(box);

    box.appendChild(Components.skeletonList(5));

    try {

    function renderList() {

      if (hadiths.length > shown) {

    page.classList.add("fade-in");

  <script>
/* ===== INLINE: js/pages/dictionary.js ===== */
/* ============================================================
   SILMIKAFFAH — PAGE: KAMUS BAHASA ARAB
   Pencarian dua arah: Arab → Indonesia & Indonesia → Arab.
   Entri: kata Arab, transliterasi, arti, jenis kata, akar
   kata, contoh, sumber. Hasil berupa LIST ringkas.
   ============================================================ */
"use strict";

const PagesDictionary = (() => {
  const { h, esc } = Utils;

  function matches(entry, q, mode) {
    const query = Utils.normalize(q);
    if (!query) return true;
    if (mode === "id") {
      return Utils.normalize(entry.arti).includes(query) || Utils.normalize(entry.latin).includes(query);
    }
    return Utils.normalize(entry.arab).includes(query) || Utils.normalize(entry.latin).includes(query);
  }

  function render(app, ctx) {
    const initialQ = (ctx.query && ctx.query.q) || "";
    let mode = initialQ && /[a-z]/i.test(initialQ) && !/[\u0600-\u06FF]/.test(initialQ) ? "id" : "arab";

    app.appendChild(Components.appBar({ title: I18n.t("dict.title"), back: true }));
    const page = h("div.page");
    app.appendChild(page);

    // Hero + mode
    const hero = h("div.tool-hero");
    hero.appendChild(h("div.tool-hero__icon", null, Components.icon("book", 26)));
    const heroText = h("div.grow");
    heroText.appendChild(h("div.typo-title-lg", null, I18n.t("dict.title")));
    heroText.appendChild(h("div.typo-caption", { style: { color: "var(--on-surface-variant)" } }, "Arab ↔ Indonesia"));
    hero.appendChild(heroText);
    page.appendChild(hero);

    const seg = h("div.segmented.mb-4");
    const modeA = h("button.segmented__item.is-active", { onclick: () => setMode("arab") }, "Arab → Indonesia");
    const modeB = h("button.segmented__item", { onclick: () => setMode("id") }, "Indonesia → Arab");
    seg.appendChild(modeA);
    seg.appendChild(modeB);
    page.appendChild(seg);

    function setMode(m) {
      mode = m;
      modeA.classList.toggle("is-active", m === "arab");
      modeB.classList.toggle("is-active", m === "id");
      run();
    }

    // Input
    const sb = h("div.search-box");
    const input = h("input.input", {
      type: "search", placeholder: "Cari kata… (mis. صلاة / shalat)", value: initialQ,
      oninput: Utils.debounce(() => run(), 200),
    });
    sb.appendChild(Components.icon("search", 22));
    sb.appendChild(input);
    page.appendChild(sb);

    const countEl = h("div.collection-count", null, window.DICTIONARY.length + " entri kamus");
    page.appendChild(countEl);

    const listBox = h("div");
    page.appendChild(listBox);

    function run() {
      const q = input.value.trim();
      const filtered = window.DICTIONARY.filter((d) => matches(d, q, mode));
      countEl.textContent = filtered.length + " / " + window.DICTIONARY.length + " entri";
      listBox.innerHTML = "";
      if (!filtered.length) {
        listBox.appendChild(Components.state({ icon: "search", title: I18n.t("search.noresult"), desc: I18n.t("search.noresult.desc") }));
        return;
      }
      const list = h("div.list");
      filtered.slice(0, 60).forEach((d) => {
        const row = h("div.list-item", {
          role: "button", tabindex: "0",
          onkeydown: (e) => { if (e.key === "Enter") open(d); },
          onclick: () => open(d),
        });
        row.appendChild(h("div.list-item__icon", null, Components.icon("book", 22)));
        const main = h("div.list-item__main");
        main.appendChild(h("div.dict-row__arab", null, d.arab + " — " + d.latin));
        main.appendChild(h("div.list-item__desc", null, esc(d.arti)));
        row.appendChild(main);
        row.appendChild(h("div.list-item__trailing", null, Components.icon("chevron-right", 20)));
        list.appendChild(row);
      });
      listBox.appendChild(list);
    }

    function open(d) {
      const info = [
        ["Latin", d.latin], ["Jenis Kata", d.jenis], ["Akar Kata", d.akar],
      ].filter((x) => x[1]);
      const wrap = h("div");
      const arabEl = h("div.dict-entry-arab", null, d.arab);
      const latinEl = h("div.typo-title.mt-2", null, d.latin);
      const artiEl = h("div.prose.mt-3", null, d.arti);
      wrap.appendChild(arabEl);
      wrap.appendChild(latinEl);
      wrap.appendChild(artiEl);
      const grid = h("div.info-grid.mt-4");
      info.forEach((c) => {
        const cell = h("div.info-cell");
        cell.appendChild(h("div.info-cell__label", null, c[0]));
        cell.appendChild(h("div.info-cell__value", null, c[1]));
        grid.appendChild(cell);
      });
      wrap.appendChild(grid);
      if (d.contoh) {
        const ex = h("div.note", null, "Contoh: " + d.contoh);
        wrap.appendChild(ex);
      }
      if (d.sumber) {
        wrap.appendChild(h("p.typo-caption.mt-3", { style: { color: "var(--on-surface-variant)" } }, "Sumber: " + d.sumber));
      }
      const copyBtn = h("button.btn.btn--tonal.mt-4", { onclick: () => Components.copyText(d.arab + "\n" + d.latin + "\n" + d.arti) }, [Components.icon("copy", 20), esc(I18n.t("action.copy"))]);
      wrap.appendChild(copyBtn);
      const sheet = Components.sheet({ title: d.title || d.latin, children: [wrap] });
      DB.addHistory("/dictionary?q=" + encodeURIComponent(d.latin), "Kamus: " + d.latin, "book").catch(() => {});
    }

    run();
    Router.setTitle(I18n.t("dict.title"));
    Components.bottomNav("/home");
    page.classList.add("fade-in");
  }

  return { render };
})();

window.Pages = window.Pages || {};
