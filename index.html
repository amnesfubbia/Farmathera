  <script>
/* ===== INLINE: js/pages/tools.js ===== */
/* ============================================================
   SILMIKAFFAH — PAGE: ALAT MUSLIM
   Jadwal Sholat penuh · Arah Kiblat (GPS) · Kalkulator Zakat
   (maal + fitrah) · Tasbih Digital. Semua punya state
   loading/empty/error/success.
   ============================================================ */
"use strict";

const PagesTools = (() => {
  const { h, esc } = Utils;
  const KAABA = { lat: 21.4225, lng: 39.8262 };

  /* ---------- Jadwal Sholat (halaman penuh) ---------- */
  async function prayer(app, ctx) {
    app.appendChild(Components.appBar({ title: I18n.t("home.prayer"), back: true }));
    const page = h("div.page");
    app.appendChild(page);
    const box = h("div");
    page.appendChild(box);

    box.appendChild(Components.skeletonList(3));
    const res = await Prayer.getTimes();
    if (!res.ok) {
      box.innerHTML = "";
      box.appendChild(Components.state({
        icon: "wifi-off", title: I18n.t("state.error"), desc: I18n.t("state.error.desc"),
        actionLabel: I18n.t("action.retry"), action: async () => { box.innerHTML = ""; box.appendChild(Components.skeletonList(3)); const r2 = await Prayer.getTimes(); if (r2.ok) render(r2); else { box.innerHTML = ""; box.appendChild(Components.state({ icon: "wifi-off", title: I18n.t("state.error"), desc: I18n.t("state.error.desc") })); } },
      }));
      Components.bottomNav("/home");
      return;
    }
    render(res);

    function render(r) {
      box.innerHTML = "";
      const locRow = h("div.row-between.mb-3");
      locRow.appendChild(h("div.row.gap-2", null, [Components.icon("pin", 20), h("span.typo-title-sm", null, esc(r.location.label))]));
      locRow.appendChild(h("span.typo-caption", { style: { color: "var(--on-surface-variant)" } }, esc(r.dateKey)));
      box.appendChild(locRow);

      const methodRow = h("div.field");
      methodRow.appendChild(h("label.field__label", { for: "prayer-method" }, I18n.t("settings.prayerMethod")));
      const sel = h("select.input", { id: "prayer-method", onchange: async () => { Settings.set("prayerMethod", parseInt(sel.value, 10)); await reload(); } });
      Prayer.METHODS.forEach((m) => {
        const opt = h("option", { value: m.id }, m.name);
        if (m.id === r.method) opt.selected = true;
        sel.appendChild(opt);
      });
      methodRow.appendChild(sel);
      box.appendChild(methodRow);

      const next = Prayer.computeNext(r.times);
      const card = h("div.card.card--flat.prayer-card");
      const nextBlock = h("div.prayer-next");
      nextBlock.appendChild(h("div.grow", null, [
        h("div.prayer-next__name", null, (next.isTomorrow ? "→ " : "") + next.next.label),
        h("div.prayer-next__countdown", null, next.isTomorrow ? I18n.t("prayer.next") + ": " + next.next.label + " · " + Prayer.countdownString(next.next.minutes) : Prayer.countdownString(next.next.minutes) + " lagi"),
      ]));
      nextBlock.appendChild(h("span.prayer-item__time", { style: { color: "var(--on-primary-soft)", fontSize: "var(--fs-title)" } }, esc(next.next.time)));
      card.appendChild(nextBlock);

      const grid = h("div.prayer-grid");
      next.items.forEach((it, i) => {
        const item = h("div.prayer-item" + (i === next.nextIndex ? ".is-next" : "") + (i < next.nextIndex ? ".is-past" : ""));
        item.appendChild(h("div.prayer-item__name", null, it.label));
        item.appendChild(h("div.prayer-item__time", null, esc(it.time)));
        grid.appendChild(item);
      });
      card.appendChild(grid);
      box.appendChild(card);

      if (r.source === "cache" && r.stale) box.appendChild(h("p.typo-caption.mt-2", { style: { color: "var(--on-surface-variant)" } }, I18n.t("state.offline")));

      async function reload() {
        box.innerHTML = "";
        box.appendChild(Components.skeletonList(3));
        const r3 = await Prayer.getTimes();
        if (r3.ok) render(r3);
        else box.appendChild(Components.state({ icon: "wifi-off", title: I18n.t("state.error"), desc: I18n.t("state.error.desc") }));
      }
    }
    Router.setTitle(I18n.t("home.prayer"));
    Components.bottomNav("/home");
    page.classList.add("fade-in");
  }

  /* ---------- Arah Kiblat ---------- */
  async function kiblat(app, ctx) {
    app.appendChild(Components.appBar({ title: "Arah Kiblat", back: true }));
    const page = h("div.page");
    app.appendChild(page);
    const box = h("div");
    page.appendChild(box);

    box.appendChild(Components.state({ type: "loading" }));
    let heading = null, headingActive = false;

    try {
      const loc = await Prayer.resolveLocation();
      const bearing = qiblaBearing(loc.lat, loc.lng);
      render(loc, bearing);

      // coba sensor heading bila ada
      if (window.DeviceOrientationEvent) {
        window.addEventListener("deviceorientationabsolute", onHeading, { passive: true });
        window.addEventListener("deviceorientation", onHeading, { passive: true });
      }
    } catch (e) {
      box.innerHTML = "";
      box.appendChild(Components.state({
        icon: "pin", title: I18n.t("state.error"), desc: "Lokasi tidak tersedia. Aktifkan GPS atau atur lokasi di Pengaturan.",
        actionLabel: I18n.t("action.retry"), action: () => Router.navigate("/tools/kiblat"),
      }));
    }

    function onHeading(ev) {
      const hd = ev.webkitCompassHeading != null ? ev.webkitCompassHeading : (ev.alpha != null ? (360 - ev.alpha) % 360 : null);
      if (hd == null) return;
      heading = hd;
      headingActive = true;
      const needle = box.querySelector(".compass__needle");
      if (needle) needle.style.transform = "rotate(" + (bearingForNeedle() ) + "deg)";
      const hint = box.querySelector(".compass__hint");
      if (hint) hint.textContent = "Sensor aktif — putar perlahan hingga penunjuk mengarah ke Ka'bah";
    }

    let bearingNow = 0;
    function bearingForNeedle() {
      if (headingActive && heading != null) return bearingNow - heading;
      return bearingNow;
    }

    function render(loc, bearing) {
      bearingNow = bearing;
      box.innerHTML = "";
      const info = h("div.note", null, "Lokasi: " + loc.label + " · Kiblat " + Math.round(bearing) + "° dari Utara (diukur ke Ka'bah).");
      box.appendChild(info);

      const wrap = h("div.compass-wrap");
      const compass = h("div.compass");
      compass.appendChild(h("div.compass__ring"));
      compass.appendChild(h("div.compass__north", null, "U"));
      compass.appendChild(h("div.compass__kabah", null, "KA'BAH"));
      const needle = h("div.compass__needle", { style: { transform: "rotate(" + bearing + "deg)" } });
      compass.appendChild(needle);
      wrap.appendChild(compass);
      wrap.appendChild(h("div.compass__value", null, Math.round(bearing) + "°"));
      wrap.appendChild(h("div.compass__hint", null, headingActive ? "Sensor aktif — putar perlahan" : "Aktifkan kompas untuk panduan arah"));
      box.appendChild(wrap);

      const btn = h("button.btn.btn--tonal.btn--block", { onclick: () => Router.navigate("/tools/kiblat") }, [Components.icon("refresh", 20), esc("Perbarui Lokasi")]);
      box.appendChild(btn);
    }

    function qiblaBearing(lat, lng) {
      const toRad = (d) => (d * Math.PI) / 180;
      const toDeg = (r) => (r * 180) / Math.PI;
      const φ1 = toRad(lat), φ2 = toRad(KAABA.lat);
      const Δλ = toRad(KAABA.lng - lng);
      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    Router.setTitle("Arah Kiblat");
    Components.bottomNav("/home");
    page.classList.add("fade-in");
  }

  /* ---------- Kalkulator Zakat ---------- */
  function zakat(app, ctx) {
    app.appendChild(Components.appBar({ title: "Kalkulator Zakat", back: true }));
    const page = h("div.page");
    app.appendChild(page);

    const tabs = h("div.tabs");
    const tabMaal = h("button.tab.is-active", { onclick: () => switchTab("maal") }, "Zakat Maal");
    const tabFitrah = h("button.tab", { onclick: () => switchTab("fitrah") }, "Zakat Fitrah");
    tabs.appendChild(tabMaal);
    tabs.appendChild(tabFitrah);
    page.appendChild(tabs);

    const body = h("div.mt-4");
    page.appendChild(body);

    const DEFAULTS = { cash: 50000000, gold: 0, silver: 0, trade: 0, debt: 0, goldPrice: 1200000, silverPrice: 15000 };
    const F = { cash: 0, gold: 0, silver: 0, trade: 0, debt: 0, goldPrice: 1200000, silverPrice: 15000 };
    const fitrah = { kg: 2.5, price: 15000 };

    function numInput(label, key, placeholder, isPrice) {
      const field = h("div.field");
      field.appendChild(h("label.field__label", { for: "z-" + key }, label));
      const inp = h("input.input", {
        id: "z-" + key, type: "number", inputmode: "numeric", min: "0", step: "any",
        placeholder: placeholder || "0",
        value: String(isPrice ? F[key] : (F[key] || "")),
        oninput: () => { const v = parseFloat(inp.value); F[key] = isNaN(v) ? 0 : v; },
      });
      field.appendChild(inp);
      return field;
    }

    function renderMaal() {
      body.innerHTML = "";
      const form = h("div");
      form.appendChild(numInput("Kas & Tabungan (Rp)", "cash", "0"));
      form.appendChild(numInput("Emas (gram)", "gold", "0"));
      form.appendChild(numInput("Perak (gram)", "silver", "0"));
      form.appendChild(numInput("Aset Perdagangan (Rp)", "trade", "0"));
      form.appendChild(numInput("Utang Jatuh Tempo (Rp)", "debt", "0"));
      form.appendChild(numInput("Harga Emas per gram (Rp)", "goldPrice", "0", true));
      form.appendChild(numInput("Harga Perak per gram (Rp)", "silverPrice", "0", true));

      const btn = h("button.btn.btn--primary.btn--block", { onclick: calculate }, [Components.icon("calculator", 20), esc("Hitung Zakat")]);
      form.appendChild(btn);
      body.appendChild(form);

      const resultBox = h("div");
      body.appendChild(resultBox);

      function calculate() {
        const goldValue = F.gold * F.goldPrice;
        const silverValue = F.silver * F.silverPrice;
        const wealth = Math.max(0, F.cash + goldValue + silverValue + F.trade - F.debt);
        const nisabGold = 85 * F.goldPrice;
        const nisabSilver = 595 * F.silverPrice;
        const nisab = Math.min(nisabGold, nisabSilver);
        const wajib = wealth >= nisab;
        const zakat = wajib ? wealth * 0.025 : 0;

        resultBox.innerHTML = "";
        const info = h("div.info-grid.mt-4");
        [
          ["Total Harta", "Rp " + wealth.toLocaleString("id-ID")],
          ["Nisab (85g emas / 595g perak)", "Rp " + nisab.toLocaleString("id-ID")],
          ["Status", wajib ? "Wajib zakat" : "Belum mencapai nisab"],
        ].forEach((c) => {
          const cell = h("div.info-cell");
          cell.appendChild(h("div.info-cell__label", null, c[0]));
          cell.appendChild(h("div.info-cell__value", null, c[1]));
          info.appendChild(cell);
        });
        resultBox.appendChild(info);

        const res = h("div.result-big");
        res.appendChild(h("div.result-big__label", null, wajib ? "Zakat yang wajib dikeluarkan (2,5%)" : "Zakat terutang"));
        res.appendChild(h("div.result-big__value", null, "Rp " + zakat.toLocaleString("id-ID")));
        resultBox.appendChild(res);

        const note = h("div.note", null, "Perhitungan ini edukatif. Untuk kepastian hukum (mis. aset yang dizakati, metode nisab) rujuk amil/lembaga zakat resmi setempat.");
        resultBox.appendChild(note);
      }
    }

    function renderFitrah() {
      body.innerHTML = "";
      const form = h("div");
      const f1 = h("div.field");
      f1.appendChild(h("label.field__label", { for: "zfit-kg" }, "Jumlah (kg beras)"));
      const kgInp = h("input.input", { id: "zfit-kg", type: "number", min: "0", step: "any", value: "2.5", oninput: () => { const v = parseFloat(kgInp.value); fitrah.kg = isNaN(v) ? 0 : v; } });
      f1.appendChild(kgInp);
      form.appendChild(f1);
      const f2 = h("div.field");
      f2.appendChild(h("label.field__label", { for: "zfit-price" }, "Harga beras per kg (Rp)"));
      const priceInp = h("input.input", { id: "zfit-price", type: "number", min: "0", step: "any", value: "15000", oninput: () => { const v = parseFloat(priceInp.value); fitrah.price = isNaN(v) ? 0 : v; } });
      f2.appendChild(priceInp);
      form.appendChild(f2);

      const btn = h("button.btn.btn--primary.btn--block", {
        onclick: () => {
          const total = fitrah.kg * fitrah.price;
          body.querySelector(".result-big") && body.querySelector(".result-big").remove();
          const res = h("div.result-big");
          res.appendChild(h("div.result-big__label", null, "Zakat fitrah yang dikeluarkan"));
          res.appendChild(h("div.result-big__value", null, "Rp " + total.toLocaleString("id-ID")));
          res.appendChild(h("div.result-big__label", null, fitrah.kg + " kg × Rp " + fitrah.price.toLocaleString("id-ID")));
          body.appendChild(res);
          const note = h("div.note", null, "Ukuran 1 sha' (± 2,5–3 kg) sesuai kebiasaan makanan pokok setempat; waktu wajib: akhir Ramadhan sebelum shalat Id.");
          body.appendChild(note);
        },
      }, [Components.icon("calculator", 20), esc("Hitung Zakat Fitrah")]);
      form.appendChild(btn);
      body.appendChild(form);
    }

    function switchTab(t) {
      tabMaal.classList.toggle("is-active", t === "maal");
      tabFitrah.classList.toggle("is-active", t === "fitrah");
      if (t === "maal") renderMaal(); else renderFitrah();
    }
    renderMaal();

    Router.setTitle("Kalkulator Zakat");
    Components.bottomNav("/home");
    page.classList.add("fade-in");
  }

  /* ---------- Tasbih Digital ---------- */
  function tasbih(app, ctx) {
    app.appendChild(Components.appBar({ title: "Tasbih Digital", back: true }));
    const page = h("div.page");
    app.appendChild(page);

    const targetRow = h("div.chip-row");
    let target = 33;
    [33, 100, 1000].forEach((t) => {
      const chip = h("button.chip" + (t === target ? ".is-active" : ""), { onclick: () => { count = 0; target = t; targetRow.querySelectorAll(".chip").forEach((c) => c.classList.remove("is-active")); chip.classList.add("is-active"); update(); } }, t + "×");
      targetRow.appendChild(chip);
    });
    page.appendChild(targetRow);

    let count = 0;
    const wrap = h("div.compass-wrap");
    const circle = h("button.tasbih-btn", {
      "aria-label": "Hitung dzikir",
      onclick: () => { count++; if (count >= target) { count = 0; Components.toast("Selesai 1 putaran — " + target + " dzikir ✓"); } update(); },
    });
    const countEl = h("div.tasbih-count");
    const labelEl = h("div.tasbih-label");
    circle.appendChild(countEl);
    circle.appendChild(labelEl);
    wrap.appendChild(circle);
    wrap.appendChild(h("div.compass__value", null, "Tasbih"));
    wrap.appendChild(h("div.compass__hint", null, "Ketuk lingkaran untuk menghitung dzikir"));

    const resetBtn = h("button.btn.btn--outline.btn--block", { onclick: () => { count = 0; update(); } }, [Components.icon("refresh", 20), esc("Reset")]);
    page.appendChild(wrap);
    page.appendChild(resetBtn);

    const done = h("div.note", null, "Sesuai sunah: Subhanallah 33×, Alhamdulillah 33×, Allahu Akbar 34× setelah shalat (HR. Muslim).");
    page.appendChild(done);

    function update() {
      countEl.textContent = String(count);
      labelEl.textContent = count + " / " + target;
      const pct = Math.min(100, (count / target) * 100);
      circle.style.background = "conic-gradient(var(--primary) " + pct + "%, var(--surface-variant) " + pct + "%)";
    }
    update();

    Router.setTitle("Tasbih Digital");
    Components.bottomNav("/home");
    page.classList.add("fade-in");
  }

  return { prayer, kiblat, zakat, tasbih };
})();

window.Pages = window.Pages || {};
window.Pages.tools = PagesTools;

</script>
  <script>
/* ===== INLINE: js/pages/collections.js ===== */
/* ============================================================
   SILMIKAFFAH — PAGE: KOLEKSI PRIBADI
   Tabs: Bookmark · Favorit · Riwayat · Catatan (CRUD).
   Semua tersimpan lokal di IndexedDB.
   ============================================================ */
"use strict";

const PagesCollections = (() => {
  const { h, esc } = Utils;

  function render(app, ctx) {
    app.appendChild(Components.appBar({ title: I18n.t("collection.title"), back: true }));
    const page = h("div.page");
    app.appendChild(page);

    const tabs = h("div.tabs");
    const tabsData = [
      { key: "bookmarks", label: I18n.t("collection.bookmarks") },
      { key: "favorites", label: I18n.t("collection.favorites") },
      { key: "history", label: I18n.t("collection.history") },
      { key: "notes", label: I18n.t("collection.notes") },
    ];
    const tabEls = {};
    let activeTab = "bookmarks";

    tabsData.forEach((t) => {
      const tb = h("button.tab" + (t.key === activeTab ? ".is-active" : ""), { onclick: () => switchTab(t.key) }, t.label);
      tabEls[t.key] = tb;
      tabs.appendChild(tb);
    });
    page.appendChild(tabs);

    const box = h("div.mt-4");
    page.appendChild(box);

    function switchTab(key) {
      activeTab = key;
      tabsData.forEach((t) => tabEls[t.key].classList.toggle("is-active", t.key === key));
      load();
    }

    async function load() {
      box.innerHTML = "";
      box.appendChild(Components.skeletonList(3));
      try {
        if (activeTab === "bookmarks") await renderBookmarks();
        else if (activeTab === "favorites") await renderFavorites();
        else if (activeTab === "history") await renderHistory();
        else await renderNotes();
      } catch (e) {
        box.innerHTML = "";
        box.appendChild(Components.state({ icon: "alert", title: I18n.t("state.error"), desc: I18n.t("state.error.desc"), actionLabel: I18n.t("action.retry"), action: load }));
      }
    }

    async function renderBookmarks() {
      box.innerHTML = "";
      const items = await DB.getBookmarks();
      if (!items.length) { box.appendChild(Components.state({ icon: "bookmark", title: I18n.t("state.empty"), desc: "Ketuk ikon tandai pada halaman materi untuk menyimpannya di sini." })); return; }
      const list = h("div.list");
      items.forEach((it) => {
        list.appendChild(Components.listRow({
          icon: it.icon || "book", title: it.title, desc: it.target,
          onClick: () => Router.navigate(it.target),
          trail: Components.iconBtn("trash", { label: I18n.t("action.delete"), onClick: async () => { await DB.removeBookmark(it.target); load(); } }),
        }));
      });
      box.appendChild(list);
    }

    async function renderFavorites() {
      box.innerHTML = "";
      const items = await DB.getFavorites();
      if (!items.length) { box.appendChild(Components.state({ icon: "heart", title: I18n.t("state.empty"), desc: "Ketuk ikon hati pada halaman materi untuk memfavoritkannya." })); return; }
      const list = h("div.list");
      items.forEach((it) => {
        list.appendChild(Components.listRow({
          icon: it.icon || "book", title: it.title, desc: it.target,
          onClick: () => Router.navigate(it.target),
          trail: Components.iconBtn("trash", { label: I18n.t("action.delete"), onClick: async () => { await DB.removeFavorite(it.target); load(); } }),
        }));
      });
      box.appendChild(list);
    }

    async function renderHistory() {
      box.innerHTML = "";
      const items = await DB.getHistory(50);
      if (!items.length) { box.appendChild(Components.state({ icon: "history", title: I18n.t("state.empty"), desc: "Riwayat bacaan Anda akan tampil di sini." })); return; }
      const clearBtn = h("button.btn.btn--danger-ghost.btn--sm.mb-3", { onclick: async () => { await DB.clearHistory(); load(); } }, [Components.icon("trash", 16), esc("Bersihkan Riwayat")]);
      box.appendChild(clearBtn);
      const list = h("div.list");
      items.forEach((it) => {
        list.appendChild(Components.listRow({ icon: it.icon || "book", title: it.title, desc: it.target, onClick: () => Router.navigate(it.target) }));
      });
      box.appendChild(list);
    }

    async function renderNotes() {
      box.innerHTML = "";
      const addBtn = h("button.btn.btn--primary.btn--block.mb-3", { onclick: openNoteEditor }, [Components.icon("plus", 20), esc("Tambah Catatan")]);
      box.appendChild(addBtn);
      const items = await DB.getNotes();
      if (!items.length) { box.appendChild(Components.state({ icon: "note", title: I18n.t("state.empty"), desc: "Tulis catatan pribadi Anda di sini atau dari halaman materi." })); return; }
      items.forEach((n) => {
        const card = h("div.note-card");
        card.appendChild(h("div.note-card__title", null, esc(n.title)));
        if (n.body) card.appendChild(h("div.note-card__body", null, esc(n.body)));
        card.appendChild(h("div.note-card__meta", null, new Date(n.ts).toLocaleString("id-ID")));
        const actions = h("div.row.gap-2.mt-2");
        actions.appendChild(h("button.btn.btn--ghost.btn--sm", { onclick: () => openNoteEditor(n) }, [Components.icon("pencil", 16), esc(I18n.t("action.edit"))]));
        actions.appendChild(h("button.btn.btn--danger-ghost.btn--sm", { onclick: async () => { await DB.deleteNote(n.id); load(); } }, [Components.icon("trash", 16), esc(I18n.t("action.delete"))]));
        card.appendChild(actions);
        box.appendChild(card);
      });
    }

    function openNoteEditor(existing) {
      const titleInp = h("input.input", { type: "text", placeholder: "Judul", value: existing ? existing.title : "" });
      const bodyInp = h("textarea.input.mt-3", { placeholder: "Isi catatan…" });
      bodyInp.value = existing ? existing.body : "";
      const saveBtn = h("button.btn.btn--primary.btn--block.mt-4", {
        onclick: async () => {
          const title = titleInp.value.trim() || "Catatan";
          const body = bodyInp.value.trim();
          if (existing) await DB.updateNote(existing.id, { title, body });
          else await DB.addNote({ target: "", title, body });
          sheet.close();
          Components.toast(I18n.t("action.save") + " ✓");
          load();
        },
      }, I18n.t("action.save"));
      const sheet = Components.sheet({ title: existing ? I18n.t("action.edit") : "Catatan Baru", children: [titleInp, bodyInp, saveBtn] });
    }

    load();
    Router.setTitle(I18n.t("collection.title"));
    Components.bottomNav("/collection");
    page.classList.add("fade-in");
  }

  return { render };
})();

window.Pages = window.Pages || {};
window.Pages.collections = PagesCollections;

</script>
  <script>
/* ===== INLINE: js/pages/settings.js ===== */
/* ============================================================
   SILMIKAFFAH — PAGE: PENGATURAN
   Tema (Dark AMOLED / Light White), bahasa, ukuran font &
   font Arab, lokasi, metode jadwal sholat, notifikasi, audio,
   cache & penyimpanan, tentang, sumber data, privasi.
   ============================================================ */
"use strict";

const PagesSettings = (() => {
  const { h, esc } = Utils;

  function group(title) {
    const g = h("div.settings-group");
    g.appendChild(h("div.settings-group__title", null, title));
    return g;
  }

  function setRow({ icon: iconName, title, value, trailing, onClick }) {
    const row = h("div.set-row" + (onClick ? "" : ""), onClick ? { onclick: onClick } : {});
    row.appendChild(h("div.set-row__icon", null, Components.icon(iconName, 22)));
    const main = h("div.set-row__main");
    main.appendChild(h("div.set-row__title", null, title));
    if (value) main.appendChild(h("div.set-row__value", null, value));
    row.appendChild(main);
    if (trailing) row.appendChild(trailing);
    return row;
  }

  function switchRow(iconName, title, valueKey, desc) {
    const sw = h("label.switch");
    const inp = h("input", { type: "checkbox", checked: Settings.get(valueKey, false) ? true : null, onchange: () => Settings.set(valueKey, inp.checked) });
    sw.appendChild(inp);
    sw.appendChild(h("span.switch__track"));
    return setRow({ icon: iconName, title, value: desc, trailing: sw });
  }

  function render(app, ctx) {
    app.appendChild(Components.appBar({ title: I18n.t("settings.title"), back: true }));
    const page = h("div.page");
    app.appendChild(page);

    /* ---------- Tampilan ---------- */
    const gTampilan = group("Tampilan");
    const themeRow = setRow({ icon: "moon", title: I18n.t("settings.theme"), value: Settings.get("theme") === "dark" ? I18n.t("settings.theme.dark") : I18n.t("settings.theme.light") });
    const seg = h("div.segmented.mt-2.mb-2");
    const segDark = h("button.segmented__item" + (Settings.get("theme") === "dark" ? ".is-active" : ""), { onclick: () => { Settings.set("theme", "dark"); refresh(); } }, [Components.icon("moon", 18), esc(I18n.t("settings.theme.dark"))]);
    const segLight = h("button.segmented__item" + (Settings.get("theme") === "light" ? ".is-active" : ""), { onclick: () => { Settings.set("theme", "light"); refresh(); } }, [Components.icon("sun", 18), esc(I18n.t("settings.theme.light"))]);
    seg.appendChild(segDark);
    seg.appendChild(segLight);
    themeRow.appendChild(seg);
    gTampilan.appendChild(themeRow);

    const langRow = setRow({ icon: "globe", title: I18n.t("settings.language"), value: Settings.get("language") === "en" ? "English" : "Bahasa Indonesia" });
    const langSel = h("select.input", { style: { width: "150px" }, onchange: () => { Settings.set("language", langSel.value); refresh(); } });
    [["id", "Bahasa Indonesia"], ["en", "English"]].forEach(([v, l]) => {
      const o = h("option", { value: v }, l);
      if (v === Settings.get("language")) o.selected = true;
      langSel.appendChild(o);
    });
    langRow.appendChild(langSel);
    gTampilan.appendChild(langRow);

    gTampilan.appendChild(sliderRow("type", I18n.t("settings.font"), "fontScale", 0.85, 1.3, 0.05, "0.85× – 1.3×"));
    gTampilan.appendChild(sliderRow("align-left", I18n.t("settings.font.arabic"), "arabicScale", 0.85, 1.5, 0.05, "0.85× – 1.5×"));
    page.appendChild(gTampilan);

    /* ---------- Lokasi & Waktu ---------- */
    const gLok = group("Lokasi & Waktu");
    gLok.appendChild(switchRow("pin", "Gunakan GPS", "locationMode", Settings.get("locationMode") === "auto" ? "Aktif — otomatis mengikuti posisi" : "Manual"));
    const cityRow = setRow({ icon: "globe", title: "Kota", value: Settings.get("city", "Jakarta") });
    const citySel = h("select.input", { style: { width: "170px" }, onchange: () => { const c = Prayer.CITIES.find((x) => x.name === citySel.value); if (c) Settings.setMany({ city: c.name, lat: c.lat, lng: c.lng }); refresh(); } });
    Prayer.CITIES.forEach((c) => {
      const o = h("option", { value: c.name }, c.name);
      if (c.name === Settings.get("city", "Jakarta")) o.selected = true;
      citySel.appendChild(o);
    });
    cityRow.appendChild(citySel);
    gLok.appendChild(cityRow);

    const methodRow = setRow({ icon: "clock", title: I18n.t("settings.prayerMethod"), value: Prayer.methodName(Settings.get("prayerMethod", 20)) });
    const methodSel = h("select.input", { style: { width: "190px" }, onchange: () => { Settings.set("prayerMethod", parseInt(methodSel.value, 10)); refresh(); } });
    Prayer.METHODS.forEach((m) => {
      const o = h("option", { value: m.id }, m.name);
      if (m.id === Settings.get("prayerMethod", 20)) o.selected = true;
      methodSel.appendChild(o);
    });
    methodRow.appendChild(methodSel);
    gLok.appendChild(methodRow);
    page.appendChild(gLok);

    /* ---------- Notifikasi & Audio ---------- */
    const gNa = group("Notifikasi & Audio");
    gNa.appendChild(switchRow("bell", I18n.t("settings.notifications"), "notifications", "Pengingat waktu sholat (perangkat)"));
    gNa.appendChild(switchRow("volume", I18n.t("settings.audio"), "audioEnabled", "Putar audio ayat otomatis saat dibuka"));
    page.appendChild(gNa);

    /* ---------- Data & Cache ---------- */
    const gData = group(I18n.t("settings.cache"));
    const cacheRow = setRow({ icon: "database", title: "Ukuran penyimpanan", value: "Menghitung…" });
    gData.appendChild(cacheRow);
    const clearRow = setRow({ icon: "trash", title: I18n.t("settings.clearCache"), value: "Bersihkan cache Al-Qur'an, hadis, dan jadwal sholat", onClick: confirmClear });
    gData.appendChild(clearRow);
    page.appendChild(gData);

    /* ---------- Tentang ---------- */
    const gTentang = group(I18n.t("settings.about"));
    const about = h("div", { style: { textAlign: "center", padding: "var(--sp-4)" } });
    about.appendChild(h("img.about-logo", { src: "assets/logo.png", alt: "Logo SILMIKAFFAH", onerror: "this.style.display='none'" }));
    about.appendChild(h("div.typo-title-lg", null, "SILMIKAFFAH"));
    about.appendChild(h("div.typo-caption.mt-1", { style: { color: "var(--on-surface-variant)" } }, "Ensiklopedia Islam · Pembelajaran · Referensi · Utilitas"));
    about.appendChild(h("div.mt-2", null, h("span.version-chip", null, "v1.0.0")));
    about.appendChild(h("p.typo-body-sm.mt-3", { style: { color: "var(--on-surface-variant)" } }, "Dibangun dengan Material Design 3 · tema Dark AMOLED & Light White · identitas Hijau Tosca."));
    gTentang.appendChild(about);
    page.appendChild(gTentang);

    /* ---------- Sumber Data ---------- */
    const gSumber = group(I18n.t("settings.sources"));
    const sources = [
      { l: "Al-Qur'an & Tafsir — equran.id (Kemenag RI)", u: "https://equran.id" },
      { l: "Jadwal Sholat — Aladhan API", u: "https://aladhan.com" },
      { l: "Hadis — fawazahmed0/hadith-api", u: "https://github.com/fawazahmed0/hadith-api" },
      { l: "Kamus — Al-Munawwir & sumber terbuka", u: "" },
      { l: "Al-Qur'an Kemenag RI", u: "https://quran.kemenag.go.id" },
    ];
    const srcList = h("div.list");
    sources.forEach((s) => {
      srcList.appendChild(Components.listRow({ icon: "link", title: s.l, desc: s.u || "Rujukan", onClick: s.u ? () => window.open(s.u, "_blank", "noopener") : null }));
    });
    gSumber.appendChild(srcList);
    page.appendChild(gSumber);

    /* ---------- Privasi ---------- */
    const gPriv = group(I18n.t("settings.privacy"));
    gPriv.appendChild(h("div", { style: { padding: "0 var(--sp-4) var(--sp-4)" } }, [
      h("p.typo-body-sm", { style: { color: "var(--on-surface-variant)", lineHeight: "1.6" } },
        "Bookmark, favorit, riwayat, catatan, dan cache Anda tersimpan lokal di perangkat ini dan tidak dikirim ke server mana pun. Data lokasi hanya digunakan untuk menghitung jadwal sholat dan arah kiblat."),
    ]));
    page.appendChild(gPriv);

    /* ---------- helpers ---------- */
    function sliderRow(iconName, title, key, min, max, step, hint) {
      const row = setRow({ icon: iconName, title, value: hint });
      const slider = h("input", {
        type: "range", min: min, max: max, step: step,
        value: String(Settings.get(key, 1)),
        style: { width: "130px", flexShrink: "0" },
        oninput: () => { Settings.set(key, parseFloat(slider.value)); },
      });
      row.appendChild(slider);
      return row;
    }

    function refresh() {
      Router.navigate("/settings", { replace: true });
    }

    function confirmClear() {
      const ok = h("button.btn.btn--primary.btn--block", {
        onclick: async () => {
          sheet.close();
          const stores = ["quran_surahs", "quran_ayahs", "quran_tafsir", "hadith_collections", "hadith_books", "hadith_chapters", "hadith_entries"];
          for (const s of stores) { try { await DB.clear(s); } catch (e) { /* noop */ } }
          Store.clearAll();
          Components.toast(I18n.t("settings.clearCache.done") + " ✓");
        },
      }, "Ya, Bersihkan");
      const cancel = h("button.btn.btn--outline.btn--block.mt-2", { onclick: () => sheet.close() }, I18n.t("action.cancel"));
      const sheet = Components.sheet({ title: I18n.t("settings.clearCache"), children: [
        h("p.typo-body-sm", { style: { color: "var(--on-surface-variant)" } }, "Cache Al-Qur'an, hadis, dan jadwal sholat akan dihapus. Bookmark, favorit, riwayat, dan catatan tidak terpengaruh."),
        h("div.mt-4"), ok, cancel,
      ] });
    }

    // estimasi penyimpanan
    if (navigator.storage && navigator.storage.estimate) {
      navigator.storage.estimate().then((est) => {
        const used = ((est.usage || 0) / 1024 / 1024).toFixed(2);
        const quota = ((est.quota || 0) / 1024 / 1024 / 1024).toFixed(1);
        cacheRow.querySelector(".set-row__value").textContent = used + " MB terpakai dari " + quota + " GB";
      }).catch(() => {});
    }

    Router.setTitle(I18n.t("settings.title"));
    Components.bottomNav("/settings");
    page.classList.add("fade-in");
  }

  return { render };
})();

window.Pages = window.Pages || {};
window.Pages.settings = PagesSettings;

</script>

  <!-- Bootstrap -->
  <script>
/* ===== INLINE: js/app.js ===== */
/* ============================================================
   SILMIKAFFAH — APP BOOTSTRAP
   Init settings/tema, registrasi seluruh rute, seed database,
   splash screen, offline indicator, penanganan error global.
   ============================================================ */
"use strict";

const App = (() => {
  function registerRoutes() {
    Router.register("/home", (app, ctx) => Pages.home.render(app, ctx));
    Router.register("/k/:p1", (app, ctx) => Pages.category.render(app, ctx));
    Router.register("/k/:p1/:p2", (app, ctx) => Pages.category.render(app, ctx));
    Router.register("/k/:p1/:p2/:p3", (app, ctx) => Pages.category.render(app, ctx));
    Router.register("/k/:p1/:p2/:p3/:p4", (app, ctx) => Pages.category.render(app, ctx));
    Router.register("/search", (app, ctx) => Pages.search.render(app, ctx));
    Router.register("/quran", (app, ctx) => Pages.quran.list(app, ctx));
    Router.register("/quran/surah/:n", (app, ctx) => Pages.quran.surah(app, ctx));
    Router.register("/quran/ayah/:n/:a", (app, ctx) => Pages.quran.ayah(app, ctx));
    Router.register("/hadith", (app, ctx) => Pages.hadith.collections(app, ctx));
    Router.register("/hadith/:code", (app, ctx) => Pages.hadith.books(app, ctx));
    Router.register("/hadith/:code/:book", (app, ctx) => Pages.hadith.entries(app, ctx));
    Router.register("/dictionary", (app, ctx) => Pages.dictionary.render(app, ctx));
    Router.register("/prayer", (app, ctx) => Pages.tools.prayer(app, ctx));
    Router.register("/tools/kiblat", (app, ctx) => Pages.tools.kiblat(app, ctx));
    Router.register("/tools/zakat", (app, ctx) => Pages.tools.zakat(app, ctx));
    Router.register("/tools/tasbih", (app, ctx) => Pages.tools.tasbih(app, ctx));
    Router.register("/collection", (app, ctx) => Pages.collections.render(app, ctx));
    Router.register("/settings", (app, ctx) => Pages.settings.render(app, ctx));
  }

  function setupOffline() {
    const banner = document.createElement("div");
    banner.className = "offline-banner";
    banner.textContent = I18n.t("state.offline");
    banner.style.display = "none";
    document.body.appendChild(banner);

    const show = (on) => {
      banner.style.display = on ? "block" : "none";
      if (on) Components.toast(I18n.t("state.offline"));
    };
    window.addEventListener("online", () => { show(false); Components.toast("Online ✓"); });
    window.addEventListener("offline", () => show(true));
    if (!Api.isOnline()) show(true);
  }

  function setupGlobalError() {
    let last = 0;
    window.addEventListener("error", (e) => {
      const now = Date.now();
      if (now - last > 3000) {
        last = now;
        Components.toast(I18n.t("state.error"));
      }
      console.error("[SILMIKAFFAH]", e.message);
    });
    window.addEventListener("unhandledrejection", (e) => {
      console.warn("[SILMIKAFFAH] unhandled:", e.reason);
    });
  }

  async function init() {
    Settings.init();
    registerRoutes();
    setupOffline();
    setupGlobalError();

    // Database & seed (dibungkus try agar aplikasi tetap jalan bila gagal)
    try {
      await DB.open();
      await DB.seed();
    } catch (e) {
      console.warn("[SILMIKAFFAH] Database tidak tersedia:", e);
    }

    // Router (dibungkus try agar splash tetap hilang walau ada masalah navigasi)
    try {
      Router.init();
    } catch (e) {
      console.error("[SILMIKAFFAH] Router init gagal:", e);
    }

    // Splash → Home
    const splash = document.getElementById("splash");
    const t0 = Date.now();
    const hide = () => {
      if (splash) splash.classList.add("is-hidden");
      setTimeout(() => { if (splash && splash.parentNode) splash.parentNode.removeChild(splash); }, 600);
    };
    const wait = Math.max(0, 1100 - (Date.now() - t0));
    setTimeout(hide, wait);

    // Jaring pengaman: pastikan #app tidak pernah kosong (anti blank screen)
    setTimeout(() => {
      try {
        const app = document.getElementById("app");
        if (app && !app.children.length) Router.navigate("/home", { replace: true });
      } catch (e) { console.error("[SILMIKAFFAH] Safety net:", e); }
    }, 1800);
  }

  return { init };
})();

window.App = App;

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", () => App.init());
} else {
  App.init();
}

</script>
