  <style>
/* ===== INLINE: css/tokens.css ===== */
/* ============================================================
   SILMIKAFFAH — DESIGN TOKENS
   Material Design 3 base · Identitas: Hijau Tosca
   Dua tema: DARK AMOLED (default) · LIGHT WHITE
   Semua warna & skala terpusat di sini. JANGAN hard-code
   warna di komponen/halaman.
   ============================================================ */

:root {
  /* ---------- Spacing scale (4/8/12/16/20/24/32) ---------- */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;
  --sp-12: 48px;
  --sp-16: 64px;

  /* ---------- Radius ---------- */
  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --radius-full: 999px;

  /* ---------- Icon size ---------- */
  --icon-xs: 16px;
  --icon-sm: 18px;
  --icon-md: 22px;
  --icon-lg: 26px;
  --icon-xl: 32px;
  --icon-xxl: 40px;

  /* ---------- Component height ---------- */
  --h-btn: 48px;
  --h-btn-sm: 40px;
  --h-chip: 36px;
  --h-input: 52px;
  --h-appbar: 60px;
  --h-bottomnav: 62px;
  --h-tab: 48px;
  --h-list-item: 56px;
  --h-list-item-2: 72px;

  /* ---------- Typography (Material 3 scale) ---------- */
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
    "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --font-arabic: "Amiri", "Scheherazade New", "Noto Naskh Arabic",
    "Traditional Arabic", "Times New Roman", serif;

  /* Font size multipliers (diubah dari Pengaturan) */
  --font-scale: 1;
  --arabic-scale: 1;

  /* Type ramp (px) */
  --fs-display: 34px;
  --fs-headline: 26px;
  --fs-title-lg: 20px;
  --fs-title: 17px;
  --fs-title-sm: 15px;
  --fs-body: 15px;
  --fs-body-sm: 13.5px;
  --fs-label: 13px;
  --fs-caption: 11.5px;

  --lh-display: 1.25;
  --lh-headline: 1.3;
  --lh-title: 1.35;
  --lh-body: 1.55;
  --lh-label: 1.4;

  /* ---------- Motion ---------- */
  --dur-fast: 140ms;
  --dur-med: 240ms;
  --dur-slow: 420ms;
  --ease-out: cubic-bezier(0.2, 0, 0, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

  /* ---------- Layout ---------- */
  --content-max: 640px;   /* mobile-first; tablet/desktop memakai ruang */
  --page-pad: var(--sp-4);
  --grid-gap: var(--sp-3);
}

/* ============================================================
   THEME 1 — DARK AMOLED (default)
   Background nyaris hitam · surface gelap halus · teks kontras tinggi
   ============================================================ */
:root,
[data-theme="dark"] {
  color-scheme: dark;

  --primary: #2dd4bf;          /* hijau tosca terang */
  --on-primary: #00332d;
  --primary-dim: #14b8a6;
  --primary-soft: rgba(45, 212, 191, 0.14);   /* container transparan */
  --on-primary-soft: #99f6e4;

  --secondary: #6ee7b7;
  --on-secondary: #003325;

  --background: #000000;       /* AMOLED murni */
  --surface: #0b1210;          /* gelap dengan nuansa hijau */
  --surface-2: #101a17;
  --surface-variant: #16211e;
  --on-surface: #e8f5f1;
  --on-surface-variant: #9db3ad;

  --outline: #35504a;
  --outline-soft: #243b36;

  --error: #ff8a80;
  --on-error: #5c0e08;

  --success: #7ee2a8;
  --on-success: #03301a;
  --gold: #e8c877;

  --scrim: rgba(0, 0, 0, 0.55);
  --divider: rgba(232, 245, 241, 0.08);

  --elev-1: 0 1px 2px rgba(0, 0, 0, 0.5), 0 1px 3px rgba(0, 0, 0, 0.4);
  --elev-2: 0 2px 6px rgba(0, 0, 0, 0.5), 0 4px 12px rgba(0, 0, 0, 0.35);
  --elev-3: 0 6px 16px rgba(0, 0, 0, 0.55), 0 10px 28px rgba(0, 0, 0, 0.4);

  --skeleton: rgba(232, 245, 241, 0.08);
  --skeleton-hi: rgba(232, 245, 241, 0.16);

  --overlay: rgba(255, 255, 255, 0.06);
}

/* ============================================================
   THEME 2 — LIGHT WHITE
   Background putih/sangat terang · surface terang · teks gelap
   ============================================================ */
[data-theme="light"] {
  color-scheme: light;

  --primary: #0e9384;          /* hijau tosca */
  --on-primary: #ffffff;
  --primary-dim: #0b766b;
  --primary-soft: rgba(14, 147, 132, 0.12);
  --on-primary-soft: #0a5c53;

  --secondary: #0f766e;
  --on-secondary: #ffffff;

  --background: #f7fbfa;
  --surface: #ffffff;
  --surface-2: #f2f8f6;
  --surface-variant: #e2efec;
  --on-surface: #0c1412;
  --on-surface-variant: #4d625d;

  --outline: #7e9590;
  --outline-soft: #c3d6d1;

  --error: #b3261e;
  --on-error: #ffffff;

  --success: #1e7d4f;
  --on-success: #ffffff;
  --gold: #a97b13;

  --scrim: rgba(10, 18, 16, 0.5);
  --divider: rgba(12, 20, 18, 0.1);

  --elev-1: 0 1px 2px rgba(16, 40, 36, 0.08), 0 1px 3px rgba(16, 40, 36, 0.06);
  --elev-2: 0 2px 6px rgba(16, 40, 36, 0.1), 0 4px 12px rgba(16, 40, 36, 0.08);
  --elev-3: 0 6px 16px rgba(16, 40, 36, 0.12), 0 10px 28px rgba(16, 40, 36, 0.1);

  --skeleton: rgba(12, 20, 18, 0.07);
  --skeleton-hi: rgba(12, 20, 18, 0.14);

  --overlay: rgba(12, 20, 18, 0.05);
}

/* ---------- Typography helpers ---------- */
.typo-display { font-size: var(--fs-display); line-height: var(--lh-display); font-weight: 700; letter-spacing: -0.02em; }
.typo-headline { font-size: var(--fs-headline); line-height: var(--lh-headline); font-weight: 700; letter-spacing: -0.01em; }
.typo-title-lg { font-size: var(--fs-title-lg); line-height: var(--lh-title); font-weight: 600; }
.typo-title { font-size: var(--fs-title); line-height: var(--lh-title); font-weight: 600; }
.typo-title-sm { font-size: var(--fs-title-sm); line-height: var(--lh-title); font-weight: 600; }
.typo-body { font-size: var(--fs-body); line-height: var(--lh-body); font-weight: 400; }
.typo-body-sm { font-size: var(--fs-body-sm); line-height: var(--lh-body); font-weight: 400; }
.typo-label { font-size: var(--fs-label); line-height: var(--lh-label); font-weight: 500; }
.typo-caption { font-size: var(--fs-caption); line-height: 1.45; font-weight: 400; }

/* ---------- Utility token classes ---------- */
.t-primary { color: var(--primary); }
.t-on-primary { color: var(--on-primary); }
.t-secondary { color: var(--secondary); }
.t-on-surface { color: var(--on-surface); }
.t-on-surface-variant { color: var(--on-surface-variant); }
.t-error { color: var(--error); }
.t-gold { color: var(--gold); }
.bg-surface { background-color: var(--surface); }
.bg-surface-variant { background-color: var(--surface-variant); }

</style>
  <style>
/* ===== INLINE: css/base.css ===== */
/* ============================================================
   SILMIKAFFAH — BASE (reset, tipografi, utilitas)
   ============================================================ */

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  font-family: var(--font-sans);
  font-size: calc(var(--fs-body) * var(--font-scale));
  line-height: var(--lh-body);
  color: var(--on-surface);
  background-color: var(--background);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100dvh;
  overflow-x: hidden;
}

img,
svg,
video {
  display: block;
  max-width: 100%;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

input,
select,
textarea {
  font: inherit;
  color: inherit;
  border: none;
  outline: none;
  background: none;
}

a {
  color: inherit;
  text-decoration: none;
}

ul,
ol {
  list-style: none;
}

h1, h2, h3, h4 {
  font-weight: 700;
  line-height: var(--lh-title);
  letter-spacing: -0.01em;
}

/* Aksesibilitas: fokus jelas, tidak hanya warna */
:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
  border-radius: var(--radius-xs);
}

::selection {
  background: var(--primary-soft);
  color: var(--on-surface);
}

/* Scrollbar halus */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--outline); border-radius: var(--radius-full); }
::-webkit-scrollbar-thumb:hover { background: var(--primary-dim); }

/* Teks Arab — ukuran diatur terpisah via Pengaturan */
.arabic,
.arab {
  font-family: var(--font-arabic);
  font-size: calc(1.9em * var(--arabic-scale));
  line-height: 2;
  direction: rtl;
  unicode-bidi: plaintext;
  font-feature-settings: "kern", "liga";
}

.arabic-lg {
  font-family: var(--font-arabic);
  font-size: calc(2.4em * var(--arabic-scale));
  line-height: 2.1;
  direction: rtl;
}

/* ---------- Layout ---------- */
.page {
  max-width: var(--content-max);
  margin: 0 auto;
  padding: var(--sp-4) var(--page-pad) calc(var(--h-bottomnav) + var(--sp-8));
  min-height: 100dvh;
}

.page--padded-top { padding-top: calc(var(--h-appbar) + var(--sp-4)); }

.section { margin-top: var(--sp-6); }
.section--tight { margin-top: var(--sp-4); }

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-2);
  margin-bottom: var(--sp-3);
}

.section-title {
  font-size: var(--fs-title);
  font-weight: 700;
}

.section-link {
  font-size: var(--fs-label);
  font-weight: 600;
  color: var(--primary);
}

/* ---------- Grid 3 kolom (menu utama Home) ---------- */
.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--grid-gap);
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--grid-gap);
}

/* ---------- Utilitas ---------- */
.row { display: flex; align-items: center; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }
.col { display: flex; flex-direction: column; }
.grow { flex: 1; min-width: 0; }
.wrap { flex-wrap: wrap; }
.gap-1 { gap: var(--sp-1); }
.gap-2 { gap: var(--sp-2); }
.gap-3 { gap: var(--sp-3); }
.gap-4 { gap: var(--sp-4); }

.mt-1 { margin-top: var(--sp-1); }
.mt-2 { margin-top: var(--sp-2); }
.mt-3 { margin-top: var(--sp-3); }
.mt-4 { margin-top: var(--sp-4); }
.mt-6 { margin-top: var(--sp-6); }
.mb-2 { margin-bottom: var(--sp-2); }
.mb-3 { margin-bottom: var(--sp-3); }
.mb-4 { margin-bottom: var(--sp-4); }

.hide { display: none !important; }
.text-center { text-align: center; }
.text-right { text-align: right; }
.ellipsis {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.clamp-2 {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.divider {
  height: 1px;
  background: var(--divider);
  border: none;
  margin: var(--sp-4) 0;
}

/* ---------- Animasi halaman ---------- */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.fade-up { animation: fadeUp var(--dur-med) var(--ease-out) both; }

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.fade-in { animation: fadeIn var(--dur-slow) var(--ease-out) both; }

@keyframes pulseSoft {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.45; }
}

/* ---------- Responsive: tablet & desktop ---------- */
@media (min-width: 768px) {
  :root {
    --page-pad: var(--sp-6);
  }
  .page { max-width: 900px; }
}

@media (min-width: 1280px) {
  .page { max-width: 1100px; }
  .grid-3 { grid-template-columns: repeat(6, 1fr); }
}

</style>
  <style>
/* ===== INLINE: css/components.css ===== */
/* ============================================================
   SILMIKAFFAH — COMPONENTS (Material 3 · reusable)
   ============================================================ */

/* ---------- App Bar ---------- */
.app-bar {
  position: sticky;
  top: 0;
  z-index: 40;
  height: var(--h-appbar);
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: 0 var(--sp-4);
  background: color-mix(in srgb, var(--background) 82%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--divider);
}

.app-bar__title {
  font-size: var(--fs-title);
  font-weight: 700;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.app-bar__sub {
  font-size: var(--fs-caption);
  color: var(--on-surface-variant);
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.app-bar .brand {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  min-width: 0;
}

.app-bar .brand-logo {
  width: 34px;
  height: 34px;
  object-fit: contain;
  flex-shrink: 0;
}

.app-bar .brand-name {
  font-size: var(--fs-title);
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--primary);
  white-space: nowrap;
}

/* ---------- Icon button ---------- */
.icon-btn {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-full);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--on-surface);
  transition: background var(--dur-fast) var(--ease-out);
  flex-shrink: 0;
}

.icon-btn:hover { background: var(--overlay); }
.icon-btn:active { background: var(--primary-soft); }
.icon-btn--primary { color: var(--primary); }

/* ---------- Bottom Navigation (5 item · ikon saja · 20% lebar) ---------- */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 720px;
  height: var(--h-bottomnav);
  z-index: 50;
  display: flex;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--divider);
  padding-bottom: env(safe-area-inset-bottom);
}

.bottom-nav__item {
  width: 20%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  color: var(--on-surface-variant);
  position: relative;
  transition: color var(--dur-fast) var(--ease-out);
}

.bottom-nav__item .bn-icon {
  width: 26px;
  height: 26px;
}

.bottom-nav__item::before {
  content: "";
  position: absolute;
  top: 0;
  width: 0;
  height: 3px;
  border-radius: 0 0 4px 4px;
  background: var(--primary);
  transition: width var(--dur-med) var(--ease-spring);
}

.bottom-nav__item.is-active {
  color: var(--primary);
}

.bottom-nav__item.is-active::before { width: 32px; }

.bottom-nav__item:focus-visible { outline-offset: -2px; }

/* ---------- Card ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--divider);
  border-radius: var(--radius-lg);
  padding: var(--sp-4);
  box-shadow: var(--elev-1);
}

.card--flat { box-shadow: none; }
.card--pressable {
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease-out),
    border-color var(--dur-fast) var(--ease-out);
}
.card--pressable:hover { border-color: var(--outline); }
.card--pressable:active { transform: scale(0.98); }

.card--featured {
  background: linear-gradient(135deg, var(--primary-soft), transparent 70%),
    var(--surface);
  border-color: color-mix(in srgb, var(--primary) 35%, var(--divider));
}

/* ---------- List ---------- */
.list { display: flex; flex-direction: column; }

.list-item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: var(--h-list-item-2);
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out);
  -webkit-tap-highlight-color: transparent;
}

.list-item:hover { background: var(--overlay); }
.list-item:active { background: var(--primary-soft); }

.list-item--sm { min-height: var(--h-list-item); padding: var(--sp-2) var(--sp-2); }

.list-item__icon {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--primary-soft);
  color: var(--primary);
  flex-shrink: 0;
}

.list-item__icon svg { width: 22px; height: 22px; }

.list-item__main { flex: 1; min-width: 0; }
.list-item__title {
  font-size: var(--fs-title-sm);
  font-weight: 600;
  line-height: 1.35;
}
.list-item__desc {
  font-size: var(--fs-caption);
  color: var(--on-surface-variant);
  margin-top: 1px;
}

.list-item__trailing {
  color: var(--on-surface-variant);
  display: flex;
  align-items: center;
  gap: var(--sp-1);
  flex-shrink: 0;
}

.list-item__trailing svg { width: 20px; height: 20px; }

.list-item.is-active {
  background: var(--primary-soft);
  color: var(--primary);
}
.list-item.is-active .list-item__title { color: var(--primary); }

/* ---------- Menu grid (Home, 3 kolom) ---------- */
.menu-tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-4) var(--sp-2);
  border-radius: var(--radius-lg);
  background: var(--surface);
  border: 1px solid var(--divider);
  cursor: pointer;
  text-align: center;
  transition: transform var(--dur-fast) var(--ease-out),
    border-color var(--dur-fast) var(--ease-out),
    background var(--dur-fast) var(--ease-out);
  -webkit-tap-highlight-color: transparent;
}

.menu-tile:hover { border-color: var(--outline); }
.menu-tile:active { transform: scale(0.95); background: var(--primary-soft); }

.menu-tile__icon {
  width: 46px;
  height: 46px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--primary-soft);
  color: var(--primary);
}

.menu-tile__icon svg { width: 26px; height: 26px; }

.menu-tile__label {
  font-size: var(--fs-caption);
  font-weight: 600;
  line-height: 1.3;
}

/* ---------- Quick access ---------- */
.qa-chip {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: var(--sp-3) var(--sp-2);
  border-radius: var(--radius-md);
  background: var(--surface-variant);
  cursor: pointer;
  min-height: 76px;
  justify-content: center;
  transition: background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
  -webkit-tap-highlight-color: transparent;
}

.qa-chip:hover { background: var(--primary-soft); }
.qa-chip:active { transform: scale(0.95); }
.qa-chip svg { width: 24px; height: 24px; color: var(--primary); }
.qa-chip__label { font-size: var(--fs-caption); font-weight: 600; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  height: var(--h-btn);
  padding: 0 var(--sp-6);
  border-radius: var(--radius-full);
  font-weight: 700;
  font-size: var(--fs-label);
  letter-spacing: 0.01em;
  transition: transform var(--dur-fast) var(--ease-out),
    background var(--dur-fast) var(--ease-out),
    box-shadow var(--dur-fast) var(--ease-out);
  -webkit-tap-highlight-color: transparent;
}

.btn:active { transform: scale(0.97); }

.btn--primary {
  background: var(--primary);
  color: var(--on-primary);
  box-shadow: var(--elev-1);
}
.btn--primary:hover { box-shadow: var(--elev-2); }

.btn--tonal {
  background: var(--primary-soft);
  color: var(--on-primary-soft);
}

.btn--outline {
  border: 1px solid var(--outline);
  color: var(--primary);
}

.btn--ghost { color: var(--primary); }

.btn--danger-ghost { color: var(--error); }

.btn--sm { height: var(--h-btn-sm); padding: 0 var(--sp-4); font-size: var(--fs-caption); }

.btn--block { width: 100%; }

.btn svg { width: 20px; height: 20px; }

/* ---------- Chips ---------- */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: var(--h-chip);
  padding: 0 var(--sp-3);
  border-radius: var(--radius-full);
  background: var(--surface-variant);
  color: var(--on-surface);
  font-size: var(--fs-label);
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all var(--dur-fast) var(--ease-out);
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}

.chip:hover { background: var(--overlay); }
.chip.is-active {
  background: var(--primary-soft);
  color: var(--on-primary-soft);
  border-color: color-mix(in srgb, var(--primary) 45%, transparent);
}

.chip svg { width: 16px; height: 16px; }

.chip-row {
  display: flex;
  gap: var(--sp-2);
  overflow-x: auto;
  padding: var(--sp-1) 0 var(--sp-2);
  scrollbar-width: none;
}
.chip-row::-webkit-scrollbar { display: none; }

/* ---------- Inputs ---------- */
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: var(--sp-4);
}

.field__label {
  font-size: var(--fs-label);
  font-weight: 600;
  color: var(--on-surface-variant);
}

.input {
  width: 100%;
  height: var(--h-input);
  padding: 0 var(--sp-4);
  border-radius: var(--radius-md);
  background: var(--surface-variant);
  border: 1px solid transparent;
  transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}

.input:focus {
  border-color: var(--primary);
  background: var(--surface);
}

.input::placeholder { color: var(--on-surface-variant); }

textarea.input {
  height: auto;
  min-height: 96px;
  padding: var(--sp-3) var(--sp-4);
  resize: vertical;
  line-height: 1.5;
}

select.input { appearance: none; -webkit-appearance: none; }

.search-box {
  position: relative;
  display: flex;
  align-items: center;
}

.search-box svg {
  position: absolute;
  left: var(--sp-4);
  width: 22px;
  height: 22px;
  color: var(--on-surface-variant);
  pointer-events: none;
}

.search-box .input {
  padding-left: calc(var(--sp-4) + 30px);
  padding-right: var(--sp-12);
  height: var(--h-input);
  border-radius: var(--radius-full);
}

.search-box .search-clear {
  position: absolute;
  right: 8px;
  width: 36px;
  height: 36px;
}

/* ---------- Expandable ---------- */
.expandable {
  border: 1px solid var(--divider);
  border-radius: var(--radius-md);
  background: var(--surface);
  margin-bottom: var(--sp-3);
  overflow: hidden;
}

.expandable__head {
  width: 100%;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  font-weight: 600;
  font-size: var(--fs-title-sm);
  min-height: 52px;
  text-align: left;
}

.expandable__head svg.chevron {
  width: 20px;
  height: 20px;
  color: var(--on-surface-variant);
  transition: transform var(--dur-med) var(--ease-out);
  flex-shrink: 0;
}

.expandable.is-open .expandable__head svg.chevron { transform: rotate(180deg); }

.expandable__body {
  max-height: 0;
  overflow: hidden;
  transition: max-height var(--dur-med) var(--ease-out);
}

.expandable.is-open .expandable__body { max-height: 2000px; }

.expandable__content {
  padding: 0 var(--sp-4) var(--sp-4);
  font-size: var(--fs-body-sm);
  line-height: var(--lh-body);
  color: var(--on-surface);
}

.expandable__content p + p { margin-top: var(--sp-2); }

/* ---------- Tabs ---------- */
.tabs {
  display: flex;
  border-bottom: 1px solid var(--divider);
  gap: var(--sp-1);
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar { display: none; }

.tab {
  height: var(--h-tab);
  padding: 0 var(--sp-4);
  font-weight: 600;
  font-size: var(--fs-label);
  color: var(--on-surface-variant);
  position: relative;
  white-space: nowrap;
}

.tab::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 2.5px;
  border-radius: 3px 3px 0 0;
  background: var(--primary);
  transition: width var(--dur-med) var(--ease-spring);
}

.tab.is-active { color: var(--primary); }
.tab.is-active::after { width: 100%; }

/* ---------- States: loading / empty / error ---------- */
.skeleton {
  background: linear-gradient(100deg, var(--skeleton) 40%, var(--skeleton-hi) 50%, var(--skeleton) 60%);
  background-size: 200% 100%;
  animation: shimmer 1.3s infinite linear;
  border-radius: var(--radius-sm);
}

@keyframes shimmer {
  from { background-position: 200% 0; }
  to { background-position: -200% 0; }
}

.sk-line { height: 14px; border-radius: var(--radius-xs); }
.sk-line--sm { height: 10px; }
.sk-block { height: 120px; border-radius: var(--radius-lg); }

.state {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: var(--sp-3);
  padding: var(--sp-8) var(--sp-6);
  color: var(--on-surface-variant);
}

.state__icon {
  width: 64px;
  height: 64px;
  border-radius: var(--radius-full);
  background: var(--primary-soft);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
}

.state__icon svg { width: 32px; height: 32px; }

.state__title {
  font-size: var(--fs-title);
  font-weight: 700;
  color: var(--on-surface);
}

.state__desc { font-size: var(--fs-body-sm); max-width: 300px; }

/* ---------- Splash ---------- */
.splash {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--sp-4);
  background: var(--background);
  transition: opacity var(--dur-slow) var(--ease-out), visibility var(--dur-slow);
}

.splash.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.splash__logo {
  width: 96px;
  height: 96px;
  object-fit: contain;
  animation: splashPulse 2s var(--ease-out) infinite;
}

@keyframes splashPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}

.splash__name {
  font-size: var(--fs-headline);
  font-weight: 800;
  letter-spacing: 0.01em;
  color: var(--primary);
}

.splash__tagline {
  font-size: var(--fs-caption);
  color: var(--on-surface-variant);
  letter-spacing: 0.22em;
  text-transform: uppercase;
}

.splash__spinner {
  width: 26px;
  height: 26px;
  border: 2.5px solid var(--outline);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-top: var(--sp-3);
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Toast / snackbar ---------- */
.toast {
  position: fixed;
  bottom: calc(var(--h-bottomnav) + var(--sp-4));
  left: 50%;
  transform: translateX(-50%) translateY(16px);
  z-index: 90;
  max-width: 90%;
  background: var(--surface-2);
  color: var(--on-surface);
  border: 1px solid var(--divider);
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--radius-md);
  box-shadow: var(--elev-3);
  font-size: var(--fs-body-sm);
  font-weight: 500;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur-med) var(--ease-out), transform var(--dur-med) var(--ease-out);
}

.toast.is-show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- Dalil block ---------- */
.dalil {
  border-left: 3px solid var(--primary);
  background: var(--primary-soft);
  border-radius: 0 var(--radius-md) var(--radius-md) 0;
  padding: var(--sp-3) var(--sp-4);
  margin-bottom: var(--sp-3);
}

.dalil__text {
  font-size: var(--fs-body-sm);
  font-style: italic;
  line-height: 1.6;
}

.dalil__ref {
  margin-top: var(--sp-1);
  font-size: var(--fs-caption);
  font-weight: 700;
  color: var(--primary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

/* ---------- Quote (kutipan harian) ---------- */
.quote-card {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius-lg);
  background: linear-gradient(140deg, var(--primary-soft), var(--surface) 85%);
  border: 1px solid color-mix(in srgb, var(--primary) 30%, var(--divider));
  padding: var(--sp-5);
}

.quote-card__mark {
  position: absolute;
  top: var(--sp-2);
  right: var(--sp-3);
  width: 40px;
  height: 40px;
  color: color-mix(in srgb, var(--primary) 30%, transparent);
}

.quote-card__text {
  font-size: var(--fs-title);
  line-height: 1.6;
  font-weight: 500;
}

.quote-card__meta {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-top: var(--sp-3);
}

.quote-card__type {
  font-size: var(--fs-caption);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--primary);
  background: var(--primary-soft);
  padding: 4px 10px;
  border-radius: var(--radius-full);
}

.quote-card__ref {
  font-size: var(--fs-caption);
  color: var(--on-surface-variant);
  font-weight: 600;
}

/* ---------- Hijri date ---------- */
.hijri-card {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding: var(--sp-4) var(--sp-5);
}

.hijri-card__icon {
  width: 52px;
  height: 52px;
  border-radius: var(--radius-md);
  background: var(--primary-soft);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.hijri-card__icon svg { width: 28px; height: 28px; }

.hijri-card__date {
  font-size: var(--fs-headline);
  font-weight: 800;
  line-height: 1.15;
}

.hijri-card__month-year {
  font-size: var(--fs-body-sm);
  color: var(--on-surface-variant);
  font-weight: 500;
}

.hijri-card__greg {
  margin-left: auto;
  text-align: right;
  font-size: var(--fs-caption);
  color: var(--on-surface-variant);
}

/* ---------- Prayer times ---------- */
.prayer-card { padding: var(--sp-4); }

.prayer-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--sp-3);
}

.prayer-card__title {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  font-weight: 700;
  font-size: var(--fs-title-sm);
}

.prayer-card__title svg { width: 20px; height: 20px; color: var(--primary); }

.prayer-next {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  background: var(--primary-soft);
  border-radius: var(--radius-md);
  padding: var(--sp-3) var(--sp-4);
  margin-bottom: var(--sp-3);
}

.prayer-next__name { font-weight: 700; color: var(--on-primary-soft); font-size: var(--fs-title-sm); }
.prayer-next__countdown { font-size: var(--fs-caption); color: var(--on-surface-variant); }

.prayer-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--sp-2);
}

.prayer-item {
  border-radius: var(--radius-md);
  padding: var(--sp-2) var(--sp-1);
  text-align: center;
  border: 1px solid var(--divider);
}

.prayer-item.is-next {
  border-color: var(--primary);
  background: var(--primary-soft);
}

.prayer-item.is-past { opacity: 0.55; }

.prayer-item__name {
  font-size: var(--fs-caption);
  color: var(--on-surface-variant);
  font-weight: 600;
}

.prayer-item.is-next .prayer-item__name { color: var(--on-primary-soft); }

.prayer-item__time {
  font-size: var(--fs-title);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.prayer-item.is-next .prayer-item__time { color: var(--on-primary-soft); }

/* ---------- Featured carousel ---------- */
.carousel {
  display: flex;
  gap: var(--sp-3);
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  padding: var(--sp-1) 0 var(--sp-3);
  scrollbar-width: none;
  margin: 0 calc(var(--page-pad) * -1);
  padding-left: var(--page-pad);
  padding-right: var(--page-pad);
}

.carousel::-webkit-scrollbar { display: none; }

.carousel__item {
  flex: 0 0 78%;
  scroll-snap-align: start;
}

.featured-card {
  position: relative;
  padding: var(--sp-5);
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, var(--primary), var(--primary-dim));
  color: var(--on-primary);
  overflow: hidden;
  min-height: 130px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
}

.featured-card__tag {
  font-size: var(--fs-caption);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  opacity: 0.85;
}

.featured-card__title {
  font-size: var(--fs-title-lg);
  font-weight: 800;
  line-height: 1.3;
  margin-top: var(--sp-2);
}

.featured-card__desc {
  font-size: var(--fs-body-sm);
  opacity: 0.9;
  margin-top: var(--sp-1);
}

.featured-card__arrow {
  position: absolute;
  bottom: var(--sp-4);
  right: var(--sp-4);
  width: 32px;
  height: 32px;
  border-radius: var(--radius-full);
  background: color-mix(in srgb, var(--on-primary) 18%, transparent);
  display: flex;
  align-items: center;
  justify-content: center;
}

.featured-card__arrow svg { width: 18px; height: 18px; }

/* ---------- Prayer times row ---------- */

/* ---------- Settings rows ---------- */
.set-row {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  min-height: 60px;
  padding: var(--sp-2) var(--sp-4);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out);
}

.set-row:hover { background: var(--overlay); }

.set-row__icon {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-sm);
  background: var(--surface-variant);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.set-row__icon svg { width: 22px; height: 22px; }

.set-row__main { flex: 1; min-width: 0; }
.set-row__title { font-weight: 600; font-size: var(--fs-title-sm); }
.set-row__value { font-size: var(--fs-caption); color: var(--on-surface-variant); margin-top: 1px; }

/* ---------- Switch ---------- */
.switch {
  position: relative;
  width: 50px;
  height: 30px;
  flex-shrink: 0;
}

.switch input {
  position: absolute;
  opacity: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  cursor: pointer;
}

.switch__track {
  position: absolute;
  inset: 0;
  border-radius: var(--radius-full);
  background: var(--surface-variant);
  border: 2px solid var(--outline);
  transition: all var(--dur-fast) var(--ease-out);
  pointer-events: none;
}

.switch__track::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--outline);
  transition: all var(--dur-fast) var(--ease-out);
}

.switch input:checked + .switch__track {
  background: var(--primary);
  border-color: var(--primary);
}

.switch input:checked + .switch__track::after {
  left: 22px;
  background: var(--on-primary);
}

.switch input:focus-visible + .switch__track { outline: 2px solid var(--primary); outline-offset: 2px; }

/* ---------- Slider ---------- */
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  border-radius: var(--radius-full);
  background: var(--surface-variant);
  outline: none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--primary);
  border: 3px solid var(--surface);
  box-shadow: var(--elev-1);
  cursor: pointer;
}

input[type="range"]::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--primary);
  border: 3px solid var(--surface);
  cursor: pointer;
}

/* ---------- Segmented control (tema) ---------- */
.segmented {
  display: flex;
  background: var(--surface-variant);
  border-radius: var(--radius-md);
  padding: 4px;
  gap: 4px;
}

.segmented__item {
  flex: 1;
  height: 42px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-weight: 600;
  font-size: var(--fs-label);
  color: var(--on-surface-variant);
  transition: all var(--dur-fast) var(--ease-out);
}

.segmented__item svg { width: 18px; height: 18px; }

.segmented__item.is-active {
  background: var(--surface);
  color: var(--primary);
  box-shadow: var(--elev-1);
}

/* ---------- Bottom sheet / dialog ---------- */
.modal-scrim {
  position: fixed;
  inset: 0;
  background: var(--scrim);
  z-index: 80;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: fadeIn var(--dur-fast) var(--ease-out) both;
}

.sheet {
  width: 100%;
  max-width: 720px;
  background: var(--surface);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  padding: var(--sp-4) var(--sp-4) calc(var(--sp-6) + env(safe-area-inset-bottom));
  max-height: 82dvh;
  overflow-y: auto;
  animation: sheetUp var(--dur-med) var(--ease-spring) both;
}

@keyframes sheetUp {
  from { transform: translateY(60px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.sheet__grabber {
  width: 40px;
  height: 4px;
  border-radius: var(--radius-full);
  background: var(--outline);
  margin: 0 auto var(--sp-4);
}

.sheet__title {
  font-size: var(--fs-title);
  font-weight: 700;
  margin-bottom: var(--sp-3);
}

/* ---------- Search result rows ---------- */
.result-row {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3);
  border-radius: var(--radius-md);
  cursor: pointer;
  border-bottom: 1px solid var(--divider);
  transition: background var(--dur-fast) var(--ease-out);
}

.result-row:last-child { border-bottom: none; }
.result-row:hover { background: var(--overlay); }

.result-row__badge {
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--primary);
  background: var(--primary-soft);
  padding: 3px 8px;
  border-radius: var(--radius-full);
  flex-shrink: 0;
}

.result-row__title { font-weight: 600; font-size: var(--fs-title-sm); }
.result-row__path { font-size: var(--fs-caption); color: var(--on-surface-variant); }

mark {
  background: var(--primary-soft);
  color: var(--on-primary-soft);
  border-radius: 3px;
  padding: 0 1px;
}

/* ---------- Audio player ---------- */
.audio-btn {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-full);
  background: var(--primary-soft);
  color: var(--primary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.audio-btn svg { width: 22px; height: 22px; }
.audio-btn.is-playing { background: var(--primary); color: var(--on-primary); }

/* ---------- Verse (ayat) ---------- */
.ayah {
  border: 1px solid var(--divider);
  border-radius: var(--radius-lg);
  padding: var(--sp-4);
  margin-bottom: var(--sp-3);
  background: var(--surface);
  cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease-out);
}

.ayah:hover { border-color: var(--outline); }

.ayah__arab {
  font-family: var(--font-arabic);
  font-size: calc(1.55em * var(--arabic-scale));
  line-height: 2.05;
  direction: rtl;
  text-align: right;
}

.ayah__meta {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-top: var(--sp-2);
  color: var(--on-surface-variant);
  font-size: var(--fs-caption);
  font-weight: 600;
}

.ayah__trans {
  margin-top: var(--sp-2);
  font-size: var(--fs-body-sm);
  color: var(--on-surface);
  line-height: 1.6;
}

/* ---------- Kitab / kamus ---------- */
.dict-row__arab {
  font-family: var(--font-arabic);
  font-size: calc(1.3em * var(--arabic-scale));
  direction: rtl;
  line-height: 1.8;
  color: var(--primary);
}

/* ---------- FAB ---------- */
.fab {
  position: fixed;
  right: var(--sp-5);

  <script>
/* ===== INLINE: js/utils.js ===== */
/* ============================================================
   SILMIKAFFAH — UTILS
   Helper DOM, format, debounce, escape
   ============================================================ */
"use strict";

const Utils = {
  /* Buat elemen DOM: h("div.class1.class2#id", {attr}, [children|text]) */
  h(tag, props, children) {
    const m = tag.match(/^([a-zA-Z0-9]+)((?:\.[\w-]+)*)(?:#([\w-]+))?$/);
    let el;
    if (m) {
      const [, tagname, classes, id] = m;
      el = document.createElement(tagname);
      if (classes) classes.split(".").filter(Boolean).forEach((c) => el.classList.add(c));
      if (id) el.id = id;
    } else {
      el = document.createElement(tag);
    }
    if (props) {
      for (const k in props) {
        const v = props[k];
        if (v === undefined || v === null || v === false) continue;
        if (k === "class") el.className = v;
        else if (k === "html") el.innerHTML = v;
        else if (k === "dataset") Object.assign(el.dataset, v);
        else if (k.startsWith("on") && typeof v === "function")
          el.addEventListener(k.slice(2).toLowerCase(), v);
        else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
        else el.setAttribute(k, v === true ? "" : v);
      }
    }
    if (children !== undefined && children !== null) this.append(el, children);
    return el;
  },

  append(el, children) {
    if (typeof children === "string" || typeof children === "number")
      el.appendChild(document.createTextNode(String(children)));
    else if (Array.isArray(children))
      children.forEach((c) => { if (c) this.append(el, c); });
    else if (children instanceof Node) el.appendChild(children);
    return el;
  },

  el: (tag, props, children) => Utils.h(tag, props, children),

  esc(str) {
    return String(str ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  },

  /* Highlight <mark> di dalam teks yang sudah di-escape */
  highlight(text, query) {
    const t = Utils.esc(text);
    const q = String(query || "").trim();
    if (!q) return t;
    const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
    return t.replace(re, "<mark>$1</mark>");
  },

  debounce(fn, ms) {
    let t;
    return (...args) => {
      clearTimeout(t);
      t = setTimeout(() => fn(...args), ms);
    };
  },

  normalize(str) {
    return String(str || "")
      .toLowerCase()
      .replace(/['’`]/g, "")
      .replace(/[^a-z0-9\s]/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  },

  slugify(str) {
    return String(str || "")
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  },

  timeToMinutes(str) {
    // "05:32" -> 332 ; "05:32 (WIB)" -> 332
    const m = String(str || "").match(/(\d{1,2}):(\d{2})/);
    if (!m) return -1;
    return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
  },

  pad2(n) { return String(n).padStart(2, "0"); },

  minutesToTime(min) {
    min = ((min % 1440) + 1440) % 1440;
    return Utils.pad2(Math.floor(min / 60)) + ":" + Utils.pad2(min % 60);
  },

  dayKey(date) { return date.toISOString().slice(0, 10); },

  now() { return new Date(); },

  dateStr(d) {
    d = d || new Date();
    const days = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
    const months = [
      "Januari", "Februari", "Maret", "April", "Mei", "Juni",
      "Juli", "Agustus", "September", "Oktober", "November", "Desember",
    ];
    return days[d.getDay()] + ", " + d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear();
  },

  storageAvailable(type) {
    try {
      const s = window[type];
      const k = "__silimkafah_test__";
      s.setItem(k, "1");
      s.removeItem(k);
      return true;
    } catch (e) { return false; }
  },
};

window.Utils = Utils;

/* ============================================================
   SILMIKAFFAH — THEME MANAGER
   Dua tema: DARK AMOLED (default) · LIGHT WHITE
   Menerapkan data-theme pada <html> + meta theme-color.
   Semua warna berasal dari token CSS (tokens.css), tidak ada
   hard-code warna di komponen.
   ============================================================ */
"use strict";

const Theme = (() => {
  const KEY = "theme";
  const THEMES = ["dark", "light"];
  const META_COLORS = { dark: "#000000", light: "#f7fbfa" };

  let current = "dark";

  function apply(theme) {
    current = THEMES.includes(theme) ? theme : "dark";
    document.documentElement.setAttribute("data-theme", current);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", META_COLORS[current] || "#000000");
    try { window.localStorage.setItem("silmi." + KEY, current); } catch (e) { /* noop */ }
  }

  function get() { return current; }

  function set(theme) {
    apply(theme);
    document.dispatchEvent(new CustomEvent("silmi:theme", { detail: { theme: current } }));
  }

  function toggle() { set(current === "dark" ? "light" : "dark"); }

  function init() {
    let saved = null;
    try { saved = window.localStorage.getItem("silmi." + KEY); } catch (e) { /* noop */ }
    apply(saved || "dark");
  }

  return { init, set, get, toggle, THEMES };
})();

/* ============================================================

"use strict";

const Settings = (() => {
  const KEY = "silmi.settings";

  const DEFAULTS = {
    theme: "dark",          // dark | light
    language: "id",         // id | en
    fontScale: 1,           // 0.85 – 1.3
    arabicScale: 1,         // 0.85 – 1.5
    locationMode: "auto",   // auto (GPS) | manual
    city: "Jakarta",
    lat: -6.2088,
    lng: 106.8456,
    prayerMethod: 20,       // 20 = KEMENAG
    notifications: false,
    audioEnabled: true,
  };

  let data = Object.assign({}, DEFAULTS);
  const listeners = [];

  function load() {
    try {
      const raw = window.localStorage.getItem(KEY);
      if (raw) data = Object.assign({}, DEFAULTS, JSON.parse(raw));
    } catch (e) { data = Object.assign({}, DEFAULTS); }
  }

  function save() {
    try { window.localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* noop */ }
  }

  function get(key, def) {
    return data[key] !== undefined ? data[key] : def;
  }

  function set(key, value) {
    data[key] = value;
    save();
    applySideEffects(key);
    listeners.forEach((fn) => fn(key, value, data));
    document.dispatchEvent(new CustomEvent("silmi:settings", { detail: { key, value } }));
  }

  function setMany(obj) {
    Object.assign(data, obj);
    save();
    Object.keys(obj).forEach(applySideEffects);
    listeners.forEach((fn) => fn("__many__", obj, data));
    document.dispatchEvent(new CustomEvent("silmi:settings", { detail: { key: "__many__", value: obj } }));
  }

  function applySideEffects(key) {
    const root = document.documentElement;
    if (key === "fontScale") root.style.setProperty("--font-scale", String(data.fontScale));
    if (key === "arabicScale") root.style.setProperty("--arabic-scale", String(data.arabicScale));
    if (key === "theme") Theme.set(data.theme);
    if (key === "language") I18n.setLang(data.language);
  }

  function onChange(fn) { listeners.push(fn); }

  function init() {
    load();
    I18n.setLang(data.language);
    Theme.set(data.theme);
    applySideEffects("fontScale");
    applySideEffects("arabicScale");
  }

/* ===== INLINE: js/store.js ===== */
/* ============================================================
   SILMIKAFFAH — STORE (key-value kecil)
   localStorage dengan prefix "silmi." — dipakai untuk cache
   ringan (jadwal sholat, preferensi) yang bukan bagian dari
   database utama (IndexedDB di db.js).
   ============================================================ */
"use strict";

const Store = (() => {
  const PREFIX = "silmi.";

  function available() {
    try {
      const s = window.localStorage;
      const k = PREFIX + "__test__";
      s.setItem(k, "1");
      s.removeItem(k);
      return true;
    } catch (e) { return false; }
  }

  function get(key, def) {
    if (!available()) return def;
    try {
      const raw = window.localStorage.getItem(PREFIX + key);
      return raw === null ? def : JSON.parse(raw);
    } catch (e) { return def; }
  }

  function set(key, value) {
    if (!available()) return;
    try { window.localStorage.setItem(PREFIX + key, JSON.stringify(value)); } catch (e) { /* noop */ }
  }

  function remove(key) {
    if (!available()) return;
    try { window.localStorage.removeItem(PREFIX + key); } catch (e) { /* noop */ }
  }

  function clearAll() {
    if (!available()) return;
    try {
      const keys = [];
      for (let i = 0; i < window.localStorage.length; i++) {
        const k = window.localStorage.key(i);
        if (k && k.startsWith(PREFIX)) keys.push(k);
      }
      keys.forEach((k) => window.localStorage.removeItem(k));
    } catch (e) { /* noop */ }
  }

  return { get, set, remove, clearAll, available };
})();

window.Store = Store;

/* ===== INLINE: js/router.js ===== */
/* ============================================================
   SILMIKAFFAH — ROUTER
   Hash-based routing dengan HISTORY STACK.
   RENDER LANGSUNG — tidak bergantung pada event hashchange
   (beberapa webview penampil file tidak memicu hashchange;
   hash hanya disinkronkan best-effort). Tombol Back aplikasi
   & Back Android/browser memakai stack yang sama.
   ============================================================ */
"use strict";

const Router = (() => {
  const routes = [];
  const MAX_STACK = 100;
  let stack = []; // [{ path, title }]
  let renderedPath = null;
  let renderedAt = 0;

  function register(pattern, fn) {
    routes.push({ seg: String(pattern).split("/").filter(Boolean), fn });
  }

  function match(path) {
    const segs = String(path).split("/").filter(Boolean);
    for (const r of routes) {
      if (r.seg.length !== segs.length) continue;
      const params = {};
      let ok = true;
      for (let i = 0; i < r.seg.length; i++) {
        const p = r.seg[i];
        if (p.startsWith(":")) params[p.slice(1)] = decodeURIComponent(segs[i]);
        else if (p !== segs[i]) { ok = false; break; }
      }
      if (ok) return { fn: r.fn, params };
    }
    return null;
  }

  function parseQuery(qs) {
    const out = {};
    if (!qs) return out;
    qs.split("&").forEach((pair) => {
      const i = pair.indexOf("=");
      if (i < 0) { out[decodeURIComponent(pair)] = ""; return; }
      out[decodeURIComponent(pair.slice(0, i))] = decodeURIComponent(pair.slice(i + 1));
    });
    return out;
  }

  function resolve(path) {
    const clean = String(path || "").split("#").pop();
    const qIdx = clean.indexOf("?");
    const qs = qIdx >= 0 ? clean.slice(qIdx + 1) : "";
    const n = clean.slice(0, qIdx < 0 ? clean.length : qIdx)
      .replace(/^\/+|\/+$/g, "")
      .split("/").filter(Boolean).join("/");
    return { path: n === "" ? "/home" : "/" + n, query: qs };
  }

  function render(path) {
    const app = document.getElementById("app");
    if (!app) return;
    const m = match(path);
    app.innerHTML = "";
    renderedPath = path;
    renderedAt = Date.now();
    if (!m) {
      navigate("/home", { replace: true });
      return;
    }
    const ctx = { path, params: m.params, query: parseQuery(resolve(location.hash).query) };
    Promise.resolve()
      .then(() => m.fn(app, ctx))
      .catch((err) => {
        console.error("[SILMIKAFFAH] Page error:", err);
        app.innerHTML = "";
        app.appendChild(Components.state({
          icon: "alert",
          title: I18n.t("state.error"),
          desc: I18n.t("state.error.desc") + (err && err.message ? " (" + err.message + ")" : ""),
          actionLabel: I18n.t("action.retry"),
          action: () => render(path),
        }));
      });
  }

  /* Sinkronkan hash (best-effort; diabaikan bila sandbox webview memblokirnya) */
  function setHash(path) {
    try {
      if (location.hash !== "#" + path) location.hash = "#" + path;
    } catch (e) { /* noop */ }
  }

  function navigate(path, opts) {
    opts = opts || {};
    const r = resolve(path);
    const target = r.path;
    const top = stack.length ? stack[stack.length - 1].path : null;
    if (opts.replace) {
      if (!stack.length) stack.push({ path: target, title: "" });
      else stack[stack.length - 1] = { path: target, title: "" };
    } else if (top !== target) {
      stack.push({ path: target, title: "" });
      if (stack.length > MAX_STACK) stack.shift();
    }
    setHash(path);
    render(target);
  }

  function back() {
    if (stack.length > 1) {
      stack.pop();
      const prev = stack[stack.length - 1].path;
      setHash(prev);
      render(prev);
    } else {
      navigate("/home", { replace: true });
    }
  }

  function onHashChange() {
    const r = resolve(location.hash.replace(/^#/, ""));
    const target = r.path;
    let found = -1;
    for (let i = stack.length - 1; i >= 0; i--) {
      if (stack[i].path === target) { found = i; break; }
    }
    if (found >= 0) stack = stack.slice(0, found + 1);
    else {
      stack.push({ path: target, title: "" });
      if (stack.length > MAX_STACK) stack.shift();
    }
    // navigate()/back() sudah merender langsung — hindari render ganda
    if (target === renderedPath && Date.now() - renderedAt < 600) return;
    render(target);
  }

  function setTitle(title) {
    if (stack.length) stack[stack.length - 1].title = title;
    document.title = title ? title + " — " + I18n.t("app.name") : I18n.t("app.name");
  }

  function current() {
    return stack.length ? stack[stack.length - 1].path : "/home";
  }

  function init() {
    window.addEventListener("hashchange", onHashChange);
    const r = resolve(location.hash.replace(/^#/, "") || "/home");
    stack = [{ path: r.path, title: "" }];
    setHash(r.path);
    render(r.path);
  }

  return { register, navigate, back, init, setTitle, current };
})();

  <script>
/* ===== INLINE: js/db.js ===== */

"use strict";

const DAILY_QUOTES = [

  { text: "…Barang siapa bertakwa kepada Allah, niscaya Dia akan membukakan jalan keluar baginya, dan memberinya rezeki dari arah yang tidak disangka-sangka…", type: "Ayat Al-Qur'an", ref: "QS. At-Talaq 65:2-3" },
];

/* ---------- Database ---------- */
const DB_NAME = "silmikaffah-db";
const DB_VERSION = 1;

const DB_STORES = [
  "categories", "subcategories", "materials", "submaterials", "entries",
  "quran_surahs", "quran_ayahs", "quran_tafsir",
  "hadith_collections", "hadith_books", "hadith_chapters", "hadith_entries",
  "duas", "dhikr", "books", "book_chapters", "persons", "events",
  "arabic_dictionary", "sources", "references", "relations",
  "bookmarks", "favorites", "history", "notes", "settings",
];

const DB = (() => {
  let dbPromise = null;
  let seedPromise = null;

  function open() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error("IndexedDB tidak didukung")); return; }
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        DB_STORES.forEach((s) => {
          if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: "id" });
        });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error("Gagal membuka database"));
    });
  }

  function ready() {
    if (!dbPromise) dbPromise = open();
    return dbPromise;
  }

  function tx(store, mode, fn) {
    return ready().then((db) => new Promise((resolve, reject) => {
      const t = db.transaction(store, mode);
      const os = t.objectStore(store);
      const out = fn(os);
      t.oncomplete = () => resolve(out && out.result !== undefined ? out.result : out);
      t.onerror = () => reject(t.error || new Error("Transaksi gagal"));
      t.onabort = () => reject(t.error || new Error("Transaksi dibatalkan"));
    }));
  }

  const put = (store, obj) => tx(store, "readwrite", (os) => os.put(obj));
  const putMany = (store, arr) => tx(store, "readwrite", (os) => arr.forEach((o) => os.put(o)));
  const get = (store, id) => tx(store, "readonly", (os) => os.get(id));
  const getAll = (store) => tx(store, "readonly", (os) => os.getAll());
  const del = (store, id) => tx(store, "readwrite", (os) => os.delete(id));
  const clear = (store) => tx(store, "readwrite", (os) => os.clear());
  const count = (store) => tx(store, "readonly", (os) => os.count());

  /* ================= Koleksi pengguna ================= */
  async function addBookmark(target, title, icon) {
    await put("bookmarks", { id: "bm:" + target, target, title, icon, ts: Date.now() });
  }
  async function isBookmarked(target) {
    return !!(await get("bookmarks", "bm:" + target));
  }
  async function removeBookmark(target) {
    await del("bookmarks", "bm:" + target);
  }
  async function getBookmarks() {
    const all = await getAll("bookmarks");
    return all.sort((a, b) => b.ts - a.ts);
  }

  async function addFavorite(target, title, icon) {
    await put("favorites", { id: "fv:" + target, target, title, icon, ts: Date.now() });
  }
  async function isFavorite(target) {
    return !!(await get("favorites", "fv:" + target));
  }
  async function removeFavorite(target) {
    await del("favorites", "fv:" + target);
  }
  async function getFavorites() {
    const all = await getAll("favorites");
    return all.sort((a, b) => b.ts - a.ts);
  }

  async function addHistory(target, title, icon) {
    const rec = { id: "hs:" + target, target, title, icon, ts: Date.now() };
    await put("history", rec);
    // batasi 50 entri
    const all = await getAll("history");
    if (all.length > 50) {
      const sorted = all.sort((a, b) => a.ts - b.ts);
      const excess = sorted.slice(0, all.length - 50);
      const t = await ready();
      return new Promise((resolve, reject) => {
        const tr = t.transaction("history", "readwrite");
        const os = tr.objectStore("history");
        excess.forEach((e) => os.delete(e.id));
        tr.oncomplete = resolve;
        tr.onerror = () => reject(tr.error);
      });
    }
  }
  async function getHistory(limit) {
    const all = await getAll("history");
    const sorted = all.sort((a, b) => b.ts - a.ts);
    return limit ? sorted.slice(0, limit) : sorted;
  }
  async function clearHistory() { await clear("history"); }

  async function addNote({ target, title, body }) {
    const id = "nt:" + Date.now();
    await put("notes", { id, target: target || "", title: title || "Catatan", body: body || "", ts: Date.now() });
    return id;
  }
  async function updateNote(id, patch) {
    const cur = await get("notes", id);
    if (!cur) return;
    await put("notes", Object.assign({}, cur, patch, { ts: Date.now() }));
  }
  async function deleteNote(id) { await del("notes", id); }
  async function getNotes() {
    const all = await getAll("notes");
    return all.sort((a, b) => b.ts - a.ts);
  }

  /* ================= Seed ================= */
  function flattenContent() {
    const out = { categories: [], subcategories: [], materials: [], submaterials: [], entries: [], relations: [], persons: [], events: [], books: [] };
    const tree = window.CONTENT || {};
    const walk = (node, depth, trail, parentRoute) => {
      const route = parentRoute + "/" + node.slug;
      const rec = { id: route, slug: node.slug, title: node.title, icon: node.icon || "book", desc: node.desc || "", route, parent: trail.length ? trail[trail.length - 1].route : null, depth };
      const kids = node.children || [];
      if (kids.length) {
        (depth === 1 ? out.categories : depth === 2 ? out.subcategories : depth === 3 ? out.materials : out.submaterials).push(rec);
      } else if (node.entry) {
        out.entries.push(Object.assign({}, rec, { entry: node.entry }));
      }
      if (trail.length) out.relations.push({ id: route + "~" + trail[trail.length - 1].route, from: trail[trail.length - 1].route, to: route, type: "child" });
      kids.forEach((k) => walk(k, depth + 1, trail.concat(rec), route));
    };
    Object.keys(tree).forEach((slug) => walk(tree[slug], 1, [], ""));
    return out;
  }

  function seed() {
    if (seedPromise) return seedPromise;
    seedPromise = (async () => {
      if (Store.get("db.seeded.v1")) return;
      const flat = flattenContent();
      const idb = await ready();
      const tr = idb.transaction([
        "categories", "subcategories", "materials", "submaterials", "entries",
        "relations", "duas", "dhikr", "arabic_dictionary", "sources",
        "persons", "events", "books", "quran_surahs", "settings",
      ], "readwrite");
      const os = (n) => tr.objectStore(n);
      flat.categories.forEach((r) => os("categories").put(r));
      flat.subcategories.forEach((r) => os("subcategories").put(r));
      flat.materials.forEach((r) => os("materials").put(r));
      flat.submaterials.forEach((r) => os("submaterials").put(r));
      flat.entries.forEach((r) => os("entries").put(r));
      flat.relations.forEach((r) => os("relations").put(r));

      (window.DUAS || []).forEach((d, i) => os("duas").put(Object.assign({ id: "dua:" + (d.id || i) }, d)));
      os("dhikr").put(Object.assign({ id: "dhikr:utama" }, window.DHIKR || {}));
      (window.DICTIONARY || []).forEach((d) => os("arabic_dictionary").put(Object.assign({ id: "dict:" + d.id }, d)));
      (window.SURAH_META || []).forEach((s) => os("quran_surahs").put({ id: "surah:" + s[0], number: s[0], arabic: s[1], name: s[2], meaning: s[3], ayahs: s[4], place: s[5] }));

      const sources = [
        { id: "src:kemenag", title: "Kemenag RI — Al-Qur'an & Tafsir", url: "https://quran.kemenag.go.id" },
        { id: "src:equran", title: "equran.id — API Al-Qur'an", url: "https://equran.id" },
        { id: "src:aladhan", title: "Aladhan — Prayer Times API", url: "https://aladhan.com" },
        { id: "src:hadithapi", title: "fawazahmed0/hadith-api", url: "https://github.com/fawazahmed0/hadith-api" },
        { id: "src:munawwir", title: "Kamus Al-Munawwir", url: "" },
        { id: "src:sittah", title: "Kutubus Sittah", url: "" },
      ];
      sources.forEach((s) => os("sources").put(s));

      const persons = [
        { id: "person:rasulullah", name: "Nabi Muhammad ﷺ", role: "Rasul terakhir", desc: "Lahir di Makkah, diutus membawa risalah Islam, teladan terbaik umat." },
        { id: "person:abubakar", name: "Abu Bakar Ash-Shiddiq", role: "Khalifah pertama", desc: "Sahabat terdekat Rasulullah ﷺ, khalifah pertama (11–13 H)." },
        { id: "person:umar", name: "Umar bin Khattab", role: "Khalifah kedua", desc: "Penetap kalender Hijriah, memperluas wilayah Islam (13–23 H)." },
        { id: "person:utsman", name: "Utsman bin Affan", role: "Khalifah ketiga", desc: "Membukukan mushaf standar Al-Qur'an (23–35 H)." },
        { id: "person:ali", name: "Ali bin Abi Thalib", role: "Khalifah keempat", desc: "Sepupu dan menantu Rasulullah ﷺ, khalifah keempat (35–40 H)." },
        { id: "person:khadijah", name: "Khadijah binti Khuwailid", role: "Istri Rasulullah ﷺ", desc: "Wanita pertama yang beriman, pendukung setia dakwah." },
        { id: "person:aisyah", name: "Aisyah binti Abu Bakar", role: "Ummul Mukminin", desc: "Salah satu perawi hadis terbanyak dan sumber ilmu." },
      ];
      persons.forEach((p) => os("persons").put(p));

      const events = [
        { id: "event:hijrah", name: "Hijrah ke Madinah", year: "1 H / 622 M", desc: "Perpindahan Nabi ﷺ dari Makkah ke Madinah; awal kalender Hijriah." },
        { id: "event:badar", name: "Perang Badar", year: "2 H", desc: "Kemenangan pertama kaum muslimin atas Quraisy." },
        { id: "event:uhud", name: "Perang Uhud", year: "3 H", desc: "Pelajaran tentang ketaatan dan ujian setelah kemenangan." },
        { id: "event:fathu-makkah", name: "Fathu Makkah", year: "8 H", desc: "Penaklukan Makkah hampir tanpa pertumpahan darah; amnesti umum." },
        { id: "event:haji-wada", name: "Haji Wada'", year: "10 H", desc: "Haji perpisahan; khutbah terakhir Rasulullah ﷺ." },
      ];
      events.forEach((e) => os("events").put(e));

      const books = [
        { id: "book:ind-bukhari", title: "Shahih Bukhari", edition: "Indonesia", collection: "ind-bukhari" },
        { id: "book:ind-muslim", title: "Shahih Muslim", edition: "Indonesia", collection: "ind-muslim" },
        { id: "book:ind-abudawud", title: "Sunan Abu Dawud", edition: "Indonesia", collection: "ind-abudawud" },
        { id: "book:ind-tirmidhi", title: "Jami' At-Tirmidzi", edition: "Indonesia", collection: "ind-tirmidhi" },
        { id: "book:ind-nasai", title: "Sunan An-Nasa'i", edition: "Indonesia", collection: "ind-nasai" },
        { id: "book:ind-ibnmajah", title: "Sunan Ibnu Majah", edition: "Indonesia", collection: "ind-ibnmajah" },
      ];
      books.forEach((b) => os("books").put(b));

      os("settings").put({ id: "app:meta", version: 1, seededAt: Date.now() });

      await new Promise((resolve, reject) => {
        tr.oncomplete = resolve;
        tr.onerror = () => reject(tr.error);
      });
      Store.set("db.seeded.v1", 1);
    })().catch((e) => {
      seedPromise = null;
      console.error("[SILMIKAFFAH] Seed gagal:", e);
    });
    return seedPromise;
  }

  return {
    open, ready, put, putMany, get, getAll, del, clear, count,
    addBookmark, isBookmarked, removeBookmark, getBookmarks,
    addFavorite, isFavorite, removeFavorite, getFavorites,
    addHistory, getHistory, clearHistory,
    addNote, updateNote, deleteNote, getNotes,
    seed,
  };
})();

window.DB = DB;
window.DAILY_QUOTES = DAILY_QUOTES;

/* ============================================================
   CONTENT API — navigasi & pencarian seluruh konten
   (berjalan di memori dari window.CONTENT; cepat & sinkron)
   ============================================================ */
const Content = (() => {
  let flatCache = null;

  function flatten() {
    if (flatCache) return flatCache;
    const out = [];
    const tree = window.CONTENT || {};
    const walk = (node, depth, trail) => {
      const route = "/k/" + trail.concat(node.slug).join("/");
      const rec = {
        slug: node.slug, title: node.title, icon: node.icon || "book",
        desc: node.desc || "", route, depth,
        parent: trail.length ? trail[trail.length - 1] : null,
        hasChildren: !!(node.children && node.children.length),
        entry: node.entry || null,
      };
      out.push(rec);
      (node.children || []).forEach((k) => walk(k, depth + 1, trail.concat(node.slug)));
    };
    Object.keys(tree).forEach((slug) => walk(tree[slug], 1, []));
    flatCache = out;
    return out;
  }

  function getNode(segments) {
    let node = null, trail = [];
    let cur = window.CONTENT;
    const path = [];
    for (const seg of segments) {
      if (!cur) return null;
      const kids = Array.isArray(cur) ? cur : Object.keys(cur).map((k) => cur[k]);
      node = kids.find((n) => n && n.slug === seg) || null;
      if (!node) return null;
      path.push(seg);
      trail.push({ title: node.title, route: "/k/" + path.join("/") });
      cur = node.children || null;
    }
    return { node, trail };
  }

  function allNodes() { return flatten(); }

  function normalize(str) {
    return String(str || "").toLowerCase()
      .replace(/['’`]/g, "")
      .replace(/[^a-z0-9\s]/g, " ")
      .replace(/\s+/g, " ").trim();
  }

  function suggestions(q) {
    const query = normalize(q);
    if (!query) return [];
    const out = [];
    for (const n of flatten()) {
      if (normalize(n.title).indexOf(query) === 0) out.push(n);
      if (out.length >= 5) break;
    }
    if (out.length < 5) {
      for (const d of window.DICTIONARY || []) {
        if (out.length >= 5) break;
        if (normalize(d.latin).indexOf(query) === 0 || normalize(d.arti).indexOf(query) === 0) {
          out.push({ title: d.latin, desc: d.arti, route: "/dictionary?q=" + encodeURIComponent(d.latin), icon: "book" });
        }
      }
    }
    return out.slice(0, 5);
  }

  function search(q, filter) {
    const query = normalize(q);
    if (!query) return [];
    const results = [];
    const push = (type, badge, title, subtitle, route, icon, score) => {
      results.push({ type, badge, title, subtitle, route, icon, score: score || 0 });
    };
    const qlen = query.length;

    // Materi (node konten)
    if (!filter || filter === "materi") {
      for (const n of flatten()) {
        if (n.title === "Rukun Islam" || n.title === "Rukun Iman") continue;
        const t = normalize(n.title), d = normalize(n.desc);
        let score = -1;
        if (t === query) score = 100;
        else if (t.indexOf(query) === 0) score = 80;
        else if (t.includes(query)) score = 60;
        else if (d.includes(query)) score = 30;
        if (score >= 0) push("materi", "Materi", n.title, n.desc || n.parent, n.route, n.icon, score);
      }
    }

    // Al-Qur'an (surah)
    if (!filter || filter === "quran") {
      for (const s of window.SURAH_META || []) {
        const t = normalize(s[2]), a = normalize(s[0]), m = normalize(s[3]);
        let score = -1;
        if (t === query) score = 90;
        else if (t.indexOf(query) === 0 || a.indexOf(query) === 0) score = 75;
        else if (t.includes(query) || m.includes(query)) score = 45;
        if (score >= 0) push("quran", "Al-Qur'an", s[2] + " (" + s[0] + ")", s[3] + " · " + s[4] + " ayat", "/quran/surah/" + s[0], "book-open", score);
      }
    }

    // Hadis (koleksi)
    if (!filter || filter === "hadith") {
      (window.HADITH_COLLECTIONS || []).forEach((h) => {
        const t = normalize(h.title);
        if (t.indexOf(query) === 0 || t.includes(query)) {
          push("hadith", "Hadis", h.title, h.desc, "/hadith/" + h.code, "scroll", 50);
        }
      });
    }

    // Kamus
    if (!filter || filter === "kamus") {
      for (const d of window.DICTIONARY || []) {
        const a = normalize(d.arab), l = normalize(d.latin), ar = normalize(d.arti);
        let score = -1;
        if (l === query || a === query) score = 95;
        else if (l.indexOf(query) === 0 || a.indexOf(query) === 0) score = 70;
        else if (l.includes(query) || ar.includes(query)) score = 40;
        if (score >= 0) push("kamus", "Kamus", d.latin + " — " + d.arti, "كلمات " + d.arab + " · " + d.jenis, "/dictionary?q=" + encodeURIComponent(d.latin), "book", score);
      }
    }

    // Doa & dzikir
    if (!filter || filter === "doa") {
      for (const d of window.DUAS || []) {
        const t = normalize(d.title), ar = normalize(d.arti);
        let score = -1;
        if (t.indexOf(query) === 0) score = 72;
        else if (t.includes(query) || ar.includes(query)) score = 42;
        if (score >= 0) push("doa", "Doa", d.title, d.arti, "/k/doa-dzikir/doa-harian", "hand", score);
      }
    }

    return results.sort((a, b) => b.score - a.score);
  }

  function dailyQuote(date) {
    const d = date || new Date();
    const start = new Date(d.getFullYear(), 0, 0);
    const day = Math.floor((d - start) / 86400000);
    const list = DAILY_QUOTES;
    return list[day % list.length];
  }

  return { flatten, getNode, allNodes, suggestions, search, dailyQuote };
})();

window.Content = Content;

</script>

/* ===== INLINE: js/services/api.js ===== */
/* ============================================================
   SILMIKAFFAH — API HELPER
   fetch dengan timeout, normalisasi error, deteksi offline.
   ============================================================ */
"use strict";

const Api = (() => {
  function isOnline() {
    return typeof navigator !== "undefined" ? navigator.onLine : true;
  }

  async function fetchJson(url, opts) {
    opts = opts || {};
    const timeout = opts.timeout || 15000;
    const controller = typeof AbortController !== "undefined" ? new AbortController() : null;
    const timer = controller ? setTimeout(() => controller.abort(), timeout) : null;
    try {
      const res = await fetch(url, Object.assign({}, opts, controller ? { signal: controller.signal } : {}));
      if (!res.ok) {
        const err = new Error("HTTP " + res.status);
        err.status = res.status;
        throw err;
      }
      const data = await res.json();
      return data;
    } catch (e) {
      if (e && e.name === "AbortError") {
        const err = new Error("Timeout");
        err.code = "TIMEOUT";
        throw err;
      }
      if (!isOnline()) { e.code = "OFFLINE"; }
      throw e;
    } finally {
      if (timer) clearTimeout(timer);
    }
  }

  function isCacheableError(e) {
    return !!(e && (e.code === "OFFLINE" || e.code === "TIMEOUT" || (e.status && e.status >= 500)));
  }

  return { fetchJson, isOnline, isCacheableError };
})();

window.Api = Api;

/* ============================================================
   SILMIKAFFAH — SERVICE: JADWAL SHOLAT (Aladhan API)

   - Validasi urutan: Subuh < Terbit < Dzuhur < Ashar < Maghrib < Isya.
   - Cache harian; error state dengan tombol Coba Lagi.
   ============================================================ */
"use strict";

const Prayer = (() => {
  const METHODS = [
    { id: 20, name: "Kemenag RI (Indonesia)" },
    { id: 3, name: "Muslim World League" },
    { id: 4, name: "Umm al-Qura, Makkah" },
    { id: 5, name: "Egyptian General Authority" },
    { id: 2, name: "ISNA (Amerika Utara)" },
    { id: 7, name: "Karachi (Pakistan)" },
    { id: 13, name: "MUIS Singapura" },
    { id: 14, name: "Diyanet Turki" },
  ];

  const LABELS = [
    { key: "Fajr", labelKey: "prayer.subuh" },
    { key: "Sunrise", labelKey: "prayer.terbit" },
    { key: "Dhuhr", labelKey: "prayer.dzuhur" },
    { key: "Asr", labelKey: "prayer.ashar" },
    { key: "Maghrib", labelKey: "prayer.maghrib" },
    { key: "Isha", labelKey: "prayer.isya" },
  ];

  const CITIES = [
    { name: "Jakarta", lat: -6.2088, lng: 106.8456 },
    { name: "Surabaya", lat: -7.2575, lng: 112.7521 },
    { name: "Bandung", lat: -6.9175, lng: 107.6191 },
    { name: "Medan", lat: 3.5952, lng: 98.6722 },
    { name: "Semarang", lat: -6.9667, lng: 110.4167 },
    { name: "Makassar", lat: -5.1477, lng: 119.4327 },
    { name: "Yogyakarta", lat: -7.7956, lng: 110.3695 },
    { name: "Palembang", lat: -2.9761, lng: 104.7754 },
    { name: "Banjarmasin", lat: -3.3186, lng: 114.5944 },
    { name: "Banda Aceh", lat: 5.5483, lng: 95.3238 },
  ];

  function methodName(id) {
    const m = METHODS.find((x) => x.id === id);
    return m ? m.name : "Kemenag RI (Indonesia)";
  }

  function gpsLocation(timeoutMs) {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) { reject(new Error("GPS tidak didukung")); return; }
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, source: "gps" }),
        (err) => reject(err),
        { enableHighAccuracy: false, timeout: timeoutMs || 8000, maximumAge: 600000 }
      );
    });
  }

  async function resolveLocation() {
    const mode = Settings.get("locationMode", "auto");
    if (mode === "auto") {
      try {
        const g = await gpsLocation();
        return { lat: g.lat, lng: g.lng, label: "Lokasi GPS", source: "gps" };
      } catch (e) {
        // fallback manual
      }
    }
    const lat = Settings.get("lat", -6.2088);
    const lng = Settings.get("lng", 106.8456);
    const city = Settings.get("city", "Jakarta");
    return { lat, lng, label: city, source: "manual" };
  }

  function toMinutes(str) {
    const m = String(str || "").match(/(\d{1,2}):(\d{2})/);
    if (!m) return -1;
    return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
  }

  /* Validasi: Subuh < Terbit < Dzuhur < Ashar < Maghrib < Isya */
  function validateOrder(times) {
    const keys = ["Fajr", "Sunrise", "Dhuhr", "Asr", "Maghrib", "Isha"];
    let prev = -1;
    for (const k of keys) {
      const v = toMinutes(times[k]);
      if (v < 0) return false;
      if (v <= prev) return false;
      prev = v;
    }
    return true;
  }

  function cacheKey(date, lat, lng, method) {
    return "prayer." + date + "." + Math.round(lat * 100) + "." + Math.round(lng * 100) + "." + method;
  }

  async function fetchTimes({ lat, lng, method, date }) {
    const d = date || new Date();
    const dd = Utils.pad2(d.getDate()) + "-" + Utils.pad2(d.getMonth() + 1) + "-" + d.getFullYear();
    const url = "https://api.aladhan.com/v1/timings/" + dd +
      "?latitude=" + lat + "&longitude=" + lng + "&method=" + (method || 20) + "&school=0";
    const data = await Api.fetchJson(url, { timeout: 12000 });
    const timings = data && data.data && data.data.timings;
    if (!timings) throw new Error("Respons API tidak lengkap");
    if (!validateOrder(timings)) throw new Error("Data waktu tidak valid");
    return timings;
  }

  async function getTimes(opts) {
    opts = opts || {};
    const method = opts.method || Settings.get("prayerMethod", 20);
    const date = opts.date || new Date();
    const loc = opts.location || await resolveLocation();
    const key = cacheKey(Utils.dayKey(date), loc.lat, loc.lng, method);

    const cached = Store.get(key, null);
    if (cached && cached.timings && cached.timings.Fajr) {
      return { ok: true, times: cached.timings, location: cached.location, method, source: "cache", dateKey: Utils.dayKey(date) };
    }

    try {
      const timings = await fetchTimes({ lat: loc.lat, lng: loc.lng, method, date });
      Store.set(key, { timings, location: loc, method, savedAt: Date.now() });
      return { ok: true, times: timings, location: loc, method, source: "api", dateKey: Utils.dayKey(date) };
    } catch (e) {
      if (cached && cached.timings) {
        return { ok: true, times: cached.timings, location: cached.location, method, source: "cache", stale: true, dateKey: Utils.dayKey(date) };
      }
      return { ok: false, error: e, location: loc, method, source: "none" };
    }
  }

  /* Sholat berikutnya: index waktu pertama yang >= sekarang; jika tidak ada → Subuh besok */
  function computeNext(timings, now) {
    now = now || new Date();
    const minutes = now.getHours() * 60 + now.getMinutes();
    const items = LABELS.map((l) => ({ key: l.key, label: I18n.t(l.labelKey), time: timings[l.key], minutes: toMinutes(timings[l.key]) }));
    for (let i = 0; i < items.length; i++) {
      if (items[i].minutes > minutes) {
        return { items, next: items[i], nextIndex: i, isTomorrow: false };
      }
    }
    return { items, next: items[0], nextIndex: 0, isTomorrow: true };
  }

  function countdownString(targetMinutes, now) {
    now = now || new Date();
    let diff = targetMinutes - (now.getHours() * 60 + now.getMinutes());
    if (diff <= 0) diff += 1440;
    const h = Math.floor(diff / 60), m = diff % 60;
    return h + " jam " + Utils.pad2(m) + " menit";
  }

  return { METHODS, CITIES, LABELS, methodName, resolveLocation, getTimes, computeNext, countdownString, validateOrder, toMinutes };
})();

/* ============================================================
   SILMIKAFFAH — SERVICE: AL-QUR'AN

   Fallback daftar surah offline dari SURAH_META.
